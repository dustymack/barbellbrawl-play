<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Prototype</title>
<!--
  Barbell Brawl – throwaway prototype of the workout tracker (StrongLifts / Jefit style), with the
  settled Stage 1 rules from docs/03 and docs/04:
    - Lift XP = effort vs your own max (70%) + working-time calories (30%), floor 0.2, hardest 5 sets count,
      grit boost +25% on sets you confirm went to failure. Cardio XP = calories from pace (ACSM, Concept2, Compendium).
    - PRs (heaviest, most reps, fastest, longest) in two tiers: all-time and 60-day recent best. One-time milestones.
    - Weekly target + week streaks + freezes, consistency XP bonus, cadence VIT, levels that never drop (XP debt).
    - Per-exercise rest, linear or rep-range progression, bar weight, sticky notes; lb/kg and a plate inventory.
    - Quick log, typed-in cardio with a Strava-lite summary, bodyweight log, calendar, edit/delete/backfill, export.
  XP is always rebuilt from the logged sets (rescoreAll), so edits and backfills recalculate everything.
  All numbers live in XPC (placeholders unless logged in docs/decisions.md). Data lives in this browser's
  localStorage only. "Reset demo data" in Settings clears it.
-->
<style>
  :root {
    --bg: #121416; --card: #1c1f23; --card2: #24282d; --line: #33373d; --text: #eceae4; --muted: #9a9ca0;
    --accent: #ff7a1a; --good: #5cc97b; --warn: #e8c547; --bad: #e0555a; --cardio: #3987e5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { max-width: 480px; margin: 0 auto; padding: 12px 16px 120px; }
  h1 { font-size: 20px; margin: 4px 0 12px; letter-spacing: .5px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 12px; }
  button { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  button.ghost { background: none; border-color: transparent; color: var(--muted); padding: 6px 8px; white-space: nowrap; }
  button.danger { color: var(--bad); }
  button.block { width: 100%; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=number], input[type=date], select, textarea { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=text], textarea { width: 100%; }
  textarea { min-height: 60px; resize: vertical; }
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .topbar h1 { margin: 0; flex: 1; }
  .art { width: 56px; height: 56px; flex: none; color: var(--text); background: var(--card2); border-radius: 10px; }
  .art.sm { width: 44px; height: 44px; }
  .art svg { width: 100%; height: 100%; display: block; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .stepper button { border: 0; border-radius: 0; padding: 6px 10px; background: var(--card2); min-width: 32px; }
  .stepper span { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; padding: 0 2px; display: inline-flex; align-items: center; justify-content: center; }
  .stepper small { color: var(--muted); font-weight: 400; }
  .stepper input { width: 52px; background: none; border: 0; color: var(--text); font: inherit; font-weight: 600; text-align: center; padding: 6px 0; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .field input[type=text], .field input[type=number] { text-transform: none; letter-spacing: 0; font-size: 15px; }
  .fields { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .toggles label { display: flex; align-items: center; gap: 6px; }
  .set { display: grid; grid-template-columns: 26px 1fr auto 50px; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #2a2e33; }
  .set.warm { opacity: .8; }
  .set .n { padding: 0; background: none; border: 0; color: var(--muted); font-weight: 700; text-align: center; height: 32px; }
  .set.warm .n { font-size: 12px; }
  .circle { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: none; padding: 0; font-weight: 800; font-size: 17px; color: var(--muted); }
  .circle.done { background: var(--good); border-color: var(--good); color: #0d1a10; }
  .circle.short { background: var(--warn); border-color: var(--warn); color: #1a150d; }
  .set.warm .circle { width: 38px; height: 38px; font-size: 14px; }
  .failq { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px 34px; font-size: 13px; color: var(--warn); }
  .failq button { padding: 4px 10px; font-size: 13px; }
  .plan { font-weight: 600; }
  .plates { font-size: 12px; color: var(--muted); }
  .note { font-size: 13px; color: var(--warn); margin-top: 8px; padding: 6px 8px; background: rgba(232,197,71,.08); border-radius: 8px; }
  .bar { height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .bar.debt > div { background: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
  .chip b { color: var(--accent); }
  .chip.sel { border-color: var(--accent); background: rgba(255,122,26,.15); }
  .chip.off { opacity: .45; text-decoration: line-through; }
  #rest { position: fixed; left: 0; right: 0; bottom: 0; background: #0c0d0f; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: none; }
  #rest .inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  #rest .t { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #rest .inner button { padding: 8px 10px; }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--accent); color: #111; font-weight: 800; padding: 10px 16px; border-radius: 12px; display: none; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.4); max-width: 90vw; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px; border: 1px solid var(--line); }
  .libgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .libitem { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-size: 12px; text-align: center; }
  .libitem .art { width: 64px; height: 64px; }
  .artpick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .artpick button { padding: 2px; }
  .artpick button.sel { border-color: var(--accent); }
  .next { border-color: var(--accent); }
  .tag { font-size: 11px; font-weight: 700; color: #111; background: var(--accent); border-radius: 6px; padding: 2px 6px; }
  .tag.soft { background: var(--card2); color: var(--muted); border: 1px solid var(--line); }
  .sugwarm { display: block; width: 100%; text-align: left; color: var(--accent); padding: 8px 0; white-space: normal; border-top: 1px solid #2a2e33; border-radius: 0; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 8px; }
  .prow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; }
  .up { color: #0ca30c; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tiles.three { grid-template-columns: 1fr 1fr 1fr; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .chartwrap { position: relative; }
  .chartwrap svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .ax { fill: #898781; font-size: 11px; font-variant-numeric: tabular-nums; }
  .lbl { fill: #c3c2b7; font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .tip { position: absolute; top: 2px; display: none; pointer-events: none; background: #0c0d0f; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 2; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  details.card summary { cursor: pointer; color: var(--muted); }
  table.log { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  table.log th, table.log td { text-align: left; padding: 5px 4px; border-top: 1px solid #2a2e33; vertical-align: top; }
  table.log th { color: var(--muted); font-weight: 600; }
  .art.lg { width: 88px; height: 88px; }
  .cphase { text-align: left; border-width: 2px; }
  .cphase.work { border-color: var(--good); }
  .cphase.trans, .cphase.ready { border-color: var(--warn); }
  .clabel { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }
  .cphase.work .clabel { color: var(--good); }
  .ctime { font-size: 72px; font-weight: 800; line-height: 1.05; margin: 4px 0 8px; }
  .cphase .bar > div { transition: width .2s linear; }
  .cphase.work .bar > div { background: var(--good); }
  .cphase.trans .bar > div, .cphase.ready .bar > div { background: var(--warn); }
  .cgrid { display: grid; gap: 4px; }
  .cgrid span { height: 10px; border-radius: 3px; background: var(--card2); border: 1px solid var(--line); }
  .cgrid span.did { background: var(--good); border-color: var(--good); }
  .cgrid span.cur { background: var(--accent); border-color: var(--accent); }
  .star { font-size: 20px; padding: 4px 6px; color: var(--muted); }
  .star.on { color: var(--warn); }
  .banner { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(232,197,71,.12); border: 1px solid rgba(232,197,71,.4); font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .banner.info { background: rgba(92,201,123,.1); border-color: rgba(92,201,123,.35); }
  .banner.bad { background: rgba(224,85,90,.1); border-color: rgba(224,85,90,.4); }
  .quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .quick button { padding: 10px 6px; font-size: 13px; }
  .weeks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
  .wk { text-align: center; font-size: 11px; color: var(--muted); }
  .wk div { height: 22px; border-radius: 5px; background: var(--card2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text); font-size: 12px; }
  .wk.hit div { background: rgba(92,201,123,.25); border-color: var(--good); }
  .wk.frozen div { background: rgba(57,135,229,.2); border-color: var(--cardio); }
  .wk.open div { border-color: var(--accent); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr) 28px; gap: 4px; }
  .cal .h { font-size: 11px; color: var(--muted); text-align: center; }
  .cal .d { min-height: 46px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); padding: 3px 4px; font-size: 12px; text-align: left; color: var(--text); }
  .cal .d.out { opacity: .35; }
  .cal .d.today { border-color: var(--accent); }
  .cal .d i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 2px 2px 0 0; }
  .cal .ws { display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .dot-lift { background: var(--accent); } .dot-circuit { background: var(--warn); } .dot-cardio { background: var(--cardio); }
  .strava { border-color: var(--cardio); }
  .strava .big { font-size: 26px; font-weight: 800; }
  .stat { display: grid; grid-template-columns: 44px 1fr 44px 36px; gap: 8px; align-items: center; margin-top: 8px; }
  .stat .bar > div { background: var(--accent); }
  .stat button { padding: 2px 0; }
  .icons { color: var(--muted); font-size: 12px; }
  .segs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .segs button { border: 0; border-radius: 0; padding: 6px 10px; }
  .segs button.sel { background: var(--accent); color: #111; font-weight: 700; }
  .derived { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .derived b { color: var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"><div class="inner">
  <div class="grow"><div class="muted small" id="restLabel">Rest</div><div class="t" id="restTime">2:00</div></div>
  <button id="restMinus">−15s</button><button id="restPlus">+15s</button><button id="restSkip">Skip</button>
</div></div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
// ---------------------------------------------------------------------------
// Exercise art: tiny side-view stick figures, 64×64. Plates are drawn as discs.
// ---------------------------------------------------------------------------
const ART = {
  squat: `<circle cx="34" cy="14" r="4.5"/><circle cx="30" cy="21" r="7" class="plate"/><path d="M31 21 L27 35 L39 38 L36 57"/><path d="M27 35 L37 39"/><path d="M30 23 L36 26 L32 22"/>`,
  bench: `<path d="M8 44 H50 M14 44 V56 M44 44 V56"/><circle cx="12" cy="39" r="4.5"/><path d="M17 40 H40 L46 48 L46 57"/><path d="M22 40 V25"/><circle cx="22" cy="23" r="7" class="plate"/>`,
  deadlift: `<circle cx="44" cy="20" r="4.5"/><path d="M40 25 L23 36 L31 46 L29 57"/><path d="M39 26 L38 44"/><circle cx="38" cy="50" r="8" class="plate"/>`,
  row: `<circle cx="48" cy="24" r="4.5"/><path d="M44 28 L22 36 L28 46 L25 57"/><path d="M42 29 L44 38 L38 39"/><circle cx="38" cy="42" r="7" class="plate"/>`,
  ohp: `<circle cx="33" cy="19" r="4.5"/><path d="M32 24 L32 40 L28 57 M32 40 L36 57"/><path d="M32 26 L27 16 L30 8 M32 26 L37 16 L34 8"/><circle cx="32" cy="7" r="6" class="plate"/>`,
  pullup: `<path d="M6 8 H58"/><path d="M24 8 L27 20 M40 8 L37 20"/><circle cx="32" cy="16" r="4.5"/><path d="M27 21 H37 M32 21 V38 L28 50 M32 38 L36 50"/><path d="M32 38 V44"/><circle cx="32" cy="48" r="4.5" class="plate"/>`,
  dip: `<path d="M12 32 H52 M16 32 V57 M48 32 V57"/><circle cx="32" cy="10" r="4.5"/><path d="M32 15 V35 L26 44 L31 52 M28 18 L27 32 M36 18 L37 32"/><circle cx="32" cy="40" r="4" class="plate"/>`,
  lunge: `<circle cx="30" cy="12" r="4.5"/><path d="M30 17 V36 L41 45 L41 57 M30 36 L22 54 L13 56"/><path d="M30 20 L26 36 M30 20 L34 36"/><path d="M23 36 H29 M31 36 H37" class="thick"/>`,
  curl: `<circle cx="30" cy="12" r="4.5"/><path d="M30 17 V38 L26 57 M30 38 L34 57"/><path d="M30 20 L30 32 L38 24"/><circle cx="40" cy="23" r="5" class="plate"/>`,
  run: `<circle cx="36" cy="12" r="4.5"/><path d="M34 17 L28 35 L38 44 L34 56 M28 35 L18 42 L12 38"/><path d="M33 20 L42 27 L46 22 M33 20 L24 25 L20 32"/>`,
  bike: `<circle cx="16" cy="46" r="10"/><circle cx="48" cy="46" r="10"/><path d="M16 46 L28 30 L44 30 L48 46 M28 30 L34 46 L44 30"/><circle cx="36" cy="10" r="4.5"/><path d="M34 15 L28 28 L34 38 M33 18 L44 28"/>`,
  walk: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L26 56 M32 36 L38 56"/><path d="M32 20 L27 33 M32 20 L37 33"/>`,
  press: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L27 56 M32 36 L37 56"/><path d="M32 21 L22 20 M32 21 L42 20"/><path d="M18 18 V23 M46 18 V23" class="thick"/>`,
  core: `<path d="M8 56 H56"/><circle cx="14" cy="44" r="4.5"/><path d="M19 46 L34 50 L44 42 L52 55"/><path d="M20 47 L24 36"/>`,
  pushup: `<path d="M6 57 H58"/><circle cx="12" cy="39" r="4.5"/><path d="M17 41 L54 54"/><path d="M21 43 L20 56"/>`,
  bwsquat: `<circle cx="34" cy="14" r="4.5"/><path d="M31 19 L27 35 L39 38 L36 57"/><path d="M27 35 L37 39"/><path d="M30 23 L46 25"/>`,
  invrow: `<path d="M6 57 H58 M8 22 H30 M12 22 V57"/><circle cx="22" cy="31" r="4.5"/><path d="M24 36 L54 55"/><path d="M28 38 L22 22"/>`,
  legraise: `<path d="M6 8 H58"/><path d="M27 8 L29 20 M37 8 L35 20"/><circle cx="32" cy="15" r="4.5"/><path d="M32 20 V38 L52 34"/>`,
  burpee: `<path d="M12 57 H52"/><circle cx="32" cy="16" r="4.5"/><path d="M32 21 V38 L27 50 M32 38 L37 50"/><path d="M32 24 L24 11 M32 24 L40 11"/>`,
  plank: `<path d="M6 57 H58"/><circle cx="13" cy="41" r="4.5"/><path d="M18 44 L54 54"/><path d="M21 45 L22 56 L32 56"/>`,
  pulldown: `<path d="M14 5 H50 M32 5 V13 M20 13 H44"/><circle cx="32" cy="24" r="4.5"/><path d="M25 14 L27 28 M39 14 L37 28"/><path d="M32 29 V42 H44 V56 M22 44 H40"/>`,
  legpress: `<path d="M6 57 H58 M8 50 H28"/><circle cx="12" cy="39" r="4.5"/><path d="M16 43 L26 50 L38 38 L48 44"/><path d="M48 30 L56 48" class="thick"/>`,
  pushdown: `<path d="M44 4 V22"/><circle cx="30" cy="12" r="4.5"/><path d="M30 17 V38 L26 57 M30 38 L34 57"/><path d="M30 21 L36 31 L44 30 L44 22"/>`,
  raise: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L27 56 M32 36 L37 56"/><path d="M32 21 L16 22 M32 21 L48 22"/><path d="M13 19 V25 M51 19 V25" class="thick"/>`,
  swing: `<circle cx="43" cy="18" r="4.5"/><path d="M39 23 L24 34 L30 45 L28 57"/><path d="M38 24 L49 34"/><circle cx="51" cy="38" r="5" class="plate"/>`,
  clean: `<circle cx="30" cy="12" r="4.5"/><circle cx="38" cy="21" r="6.5" class="plate"/><path d="M30 17 V38 L26 57 M30 38 L34 57"/><path d="M30 21 L35 27 L38 21"/>`,
  hipthrust: `<path d="M6 57 H58 M8 40 H20 M10 40 V57"/><circle cx="12" cy="34" r="4.5"/><path d="M16 38 L34 34 L44 44 L44 57"/><circle cx="32" cy="28" r="5.5" class="plate"/>`,
  rower: `<path d="M6 57 H58 M10 50 H54"/><circle cx="24" cy="22" r="4.5"/><path d="M23 27 L20 44 L34 38 L40 48 M23 30 L42 34"/><circle cx="50" cy="40" r="7"/>`,
  swim: `<circle cx="14" cy="32" r="4.5"/><path d="M19 34 L46 37 L56 33 M24 34 L32 24 L40 22"/><path d="M6 46 Q14 42 22 46 T38 46 T54 46"/>`,
  rope: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L28 50 M32 36 L36 50"/><path d="M32 20 L22 30 M32 20 L42 30"/><path d="M22 30 Q32 64 42 30"/>`,
  yoga: `<path d="M12 57 H52"/><circle cx="32" cy="10" r="4.5"/><path d="M32 15 V57 M32 36 L41 42 L32 46"/><path d="M32 19 L27 5 M32 19 L37 5"/>`,
  carry: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L26 56 M32 36 L38 56"/><path d="M32 20 L25 36 M32 20 L39 36"/><path d="M21 38 H29 M35 38 H43" class="thick"/>`,
  scale: `<path d="M12 50 H52 V56 H12 Z"/><circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L28 49 M32 36 L36 49"/><path d="M32 20 L26 32 M32 20 L38 32"/>`,
  generic: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L27 56 M32 36 L37 56"/><path d="M32 21 L24 34 M32 21 L40 34"/><path d="M20 34 H28 M36 34 H44" class="thick"/>`,
};
function art(key, cls = '') {
  return `<div class="art ${cls}"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <style>.plate{fill:#ff7a1a;stroke:#ff7a1a}.thick{stroke-width:5}</style>${ART[key] || ART.generic}</svg></div>`;
}

// ---------------------------------------------------------------------------
// Exercise library. Stat splits = the settled B14 table in docs/04 (2026-09-25). Keep in sync with balance-sim.html.
// kind: barbell | dumbbell | kettlebell | machine | weighted (bodyweight + added load)
//       | bodyweight (reps only) | timed (seconds) | cardio

    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  rows.forEach((r, i) => { if (r.pr && r[series[0].key] != null) g += `<circle cx="${xs[i]}" cy="${y(r[series[0].key])}" r="4" fill="${series[0].color}" stroke="${CV.ring}" stroke-width="2"/>`; });
  const last = rows[rows.length - 1];
  let firstLabelY = null;
  for (const s of series) {
    const v = last[s.key]; if (v == null) continue;
    const yy = y(v);
    g += `<circle cx="${xs[xs.length - 1]}" cy="${yy}" r="4" fill="${s.color}" stroke="${CV.ring}" stroke-width="2"/>`;
    if (firstLabelY == null || Math.abs(yy - firstLabelY) >= 14) g += `<text x="${xs[xs.length - 1] + 8}" y="${yy + 4}" class="lbl">${fmtNum(v)}</text>`;
    if (firstLabelY == null) firstLabelY = yy;
  }
  g += `<g class="hov" style="display:none"><line class="hx" y1="${PT}" y2="${CH - PB}" stroke="${CV.muted}"/>${series.map((s, k) => `<circle class="hd${k}" r="5" fill="${s.color}" stroke="${CV.ring}" stroke-width="2"/>`).join('')}</g>`;
  g += `<rect x="0" y="0" width="${CW}" height="${CH}" fill="transparent" data-chart="${id}"/>`;
  CHARTS[id] = { type: 'line', rows, series, unit, xs, y };
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>` : '';
  return chartShell(id, g, legend, label);
}
function barChart(rows, key, unit, label) {
  const id = 'c' + (++chartSeq);
  const ticks = niceTicks(0, Math.max(...rows.map(r => r[key])));
  const hi = ticks[ticks.length - 1], base = CH - PB;
  const y = v => PT + (1 - v / hi) * (CH - PT - PB);
  const band = (CW - PL - PR) / rows.length, bw = Math.max(2, Math.min(24, band - 2));
  const xs = rows.map((_, i) => PL + band * (i + 0.5));
  let g = gridY(ticks, y) + xLabels(xs, rows);
  rows.forEach((r, i) => {
    const top = y(r[key]), x0 = xs[i] - bw / 2, rr = Math.min(4, bw / 2, base - top);
    g += `<path class="barm" d="M${x0},${base} V${top + rr} Q${x0},${top} ${x0 + rr},${top} H${x0 + bw - rr} Q${x0 + bw},${top} ${x0 + bw},${top + rr} V${base} Z" fill="${CV.s1}"/>`;
  });
  g += `<rect x="0" y="0" width="${CW}" height="${CH}" fill="transparent" data-chart="${id}"/>`;
  CHARTS[id] = { type: 'bar', rows, series: [{ key, label, color: CV.s1 }], unit, xs };
  return chartShell(id, g, '', label);
}
function sparkline(vals) {
  if (vals.length < 2) return '';
  const w = 96, h = 32, p = 5, lo = Math.min(...vals), hi = Math.max(...vals);
  const pt = (v, i) => [p + i / (vals.length - 1) * (w - 2 * p), h - p - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - 2 * p)];
  const pts = vals.map(pt), [lx, ly] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.map(q => q.join(',')).join(' ')}" fill="none" stroke="${CV.muted}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="4" fill="${CV.s1}" stroke="${CV.ring}" stroke-width="2"/></svg>`;
}
// Hover / touch: crosshair + tooltip on lines, highlighted bar + tooltip on bars.
function chartPoint(e) {
  const rect = e.target.closest && e.target.closest('rect[data-chart]');
  const c = rect && CHARTS[rect.dataset.chart];
  if (!c) return;
  const svg = rect.ownerSVGElement, box = svg.getBoundingClientRect();
  const px = (e.clientX - box.left) / box.width * CW;
  let i = 0;
  c.xs.forEach((xx, k) => { if (Math.abs(xx - px) < Math.abs(c.xs[i] - px)) i = k; });
  const r = c.rows[i];
  if (c.type === 'line') {
    const hov = svg.querySelector('.hov');
    hov.style.display = '';
    hov.querySelector('.hx').setAttribute('x1', c.xs[i]); hov.querySelector('.hx').setAttribute('x2', c.xs[i]);
    c.series.forEach((s, k) => {
      const dot = hov.querySelector('.hd' + k);
      if (r[s.key] == null) { dot.style.display = 'none'; return; }
      dot.style.display = ''; dot.setAttribute('cx', c.xs[i]); dot.setAttribute('cy', c.y(r[s.key]));
    });
  } else {
    svg.querySelectorAll('.barm').forEach((b, k) => { b.style.opacity = k === i ? 1 : 0.4; });
  }
  const tip = svg.parentElement.querySelector('.tip');
  tip.innerHTML = `<div><b>${longDate(r.t)}</b> · ${esc(r.workout)}</div>` +
    c.series.map(s => r[s.key] == null ? '' : `<div><i style="background:${s.color}"></i>${s.label}: <b>${fmtNum(r[s.key])}</b> ${c.unit}</div>`).join('') +
    (r.sets ? `<div class="muted">${esc(r.sets.join(', '))}</div>` : '') + (r.pr ? '<div>🏆 PR</div>' : '') + (r.deloaded ? '<div class="muted">Deload session</div>' : '');
  tip.style.display = 'block';
  const left = c.xs[i] / CW * box.width, tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(box.width - tw, left - tw / 2)) + 'px';
}
function chartLeave(e) {
  const rect = e.target.closest && e.target.closest('rect[data-chart]');
  if (!rect) return;
  const svg = rect.ownerSVGElement;
  const hov = svg.querySelector('.hov'); if (hov) hov.style.display = 'none';
  svg.querySelectorAll('.barm').forEach(b => { b.style.opacity = 1; });
  svg.parentElement.querySelector('.tip').style.display = 'none';
}
document.addEventListener('pointermove', chartPoint);
document.addEventListener('pointerdown', chartPoint);
document.addEventListener('pointerout', chartLeave);

function progressView() {

  if (!rows.length) return head + '<div class="card muted">Nothing logged yet. Log it and your progress shows up here.</div>';

  const tiles = [];
  if (isLoaded(d.kind)) tiles.push(['Next session', `${fmtW(xs(d.id).weight, d)} ${U()}`]);

  if (rows.some(r => r.e1rm)) tiles.push(['Best est. 1RM', `${fmtNum(Math.max(...rows.map(r => r.e1rm || 0)))} ${U()}`]);
  if (rows.some(r => r.pace)) tiles.push(['Best pace', `${fmtClock(Math.min(...rows.filter(r => r.pace).map(r => r.pace)) * 60)} /${distUnit(d)}`]);
  if (bw) tiles.push(['Latest', `${fmtNum(last.main)} ${m.unit}`]);

    : `<h2>Total ${d.kind === 'timed' ? 'seconds' : 'reps'} per session</h2><div class="card">${barChart(rows, 'total', repUnit(d), 'Total per session')}</div>`;
  return head + `
    <div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>

    ${second}

      ${[...rows].reverse().map(r => `<tr><td>${shortDate(r.t)}</td><td>${bw ? '' : esc(r.workout)}</td><td>${esc(r.sets.join(', '))}${r.pr ? ' 🏆' : ''}${r.deloaded ? ' <span class="muted">(deload)</span>' : ''}</td></tr>`).join('')}

}

  const byDay = {};
  for (const h of S.history) (byDay[isoDate(h.started)] = byDay[isoDate(h.started)] || []).push(h);
  const wkStatus = Object.fromEntries(R.weeks.map(w => [w.w, w]));
  let cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="h">${d}</div>`).join('') + '<div class="h">wk</div>';
  for (let w = start; ; w = addDays(w, 7)) {
    for (let k = 0; k < 7; k++) {
      const t = addDays(w, k), d = new Date(t), list = byDay[isoDate(t)] || [];
      cells += `<button class="d ${d.getMonth() !== month ? 'out' : ''} ${isoDate(t) === isoDate(Date.now()) ? 'today' : ''}" ${list.length ? `data-act="openHist" data-id="${list[0].id}"` : ''}>${d.getDate()}<br>${list.map(h => `<i class="dot-${sessionKind(h)}"></i>`).join('')}</button>`;
    }
    const ws = wkStatus[w];
    cells += `<div class="ws" title="${ws ? ws.status : ''}">${!ws ? '' : ws.status === 'hit' ? '✓' : ws.status === 'frozen' ? '❄️' : ws.status === 'missed' ? '<span class="muted">✗</span>' : '…'}</div>`;
    if (new Date(addDays(w, 7)).getMonth() !== month) break;
  }
  return `<div class="topbar"><button class="ghost" data-act="home">← Home</button><h1>Calendar</h1></div>
    <div class="row" style="margin-bottom:8px"><button class="ghost" data-act="calNav" data-d="-1">◀</button><b class="grow" style="text-align:center">${base.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</b><button class="ghost" data-act="calNav" data-d="1">▶</button></div>
    <div class="cal">${cells}</div>
    <div class="muted small" style="margin-top:10px"><i class="dot-lift" style="display:inline-block;width:8px;height:8px;border-radius:50%"></i> lifting · <i class="dot-circuit" style="display:inline-block;width:8px;height:8px;border-radius:50%"></i> circuit · <i class="dot-cardio" style="display:inline-block;width:8px;height:8px;border-radius:50%"></i> cardio · ✓ target hit · ❄️ freeze used · ✗ missed. Tap a day to open it.</div>`;
}

             ${isLoaded(d.kind) ? `<label class="field">${d.kind === 'weighted' ? 'Added weight' : d.impl ? 'Weight per hand' : 'Weight'} ${stepper(toDisp(st.weight), 'exW', `data-exid="${it.exId}"`, ` ${U()}`, { typed: true, prefix: d.kind === 'weighted' ? 'BW+' : '' })}</label>` : ''}

const progLine = (d, st) => st.prog === 'range'
  ? `Rep range ${st.repMin}–${st.repMax}: add reps, then ${isLoaded(d.kind) ? `+${fmtNum(toDisp(st.inc))} ${U()} at the top` : 'keep going'} · next target ${st.repTarget}`

// ---------------------------------------------------------------------------

function cardioEditor(def, c, data) {
  const kg = bodyweight() / LB, kcal = Math.round(cardioKcal(def, c, kg));
  return `<div class="fields">
      <label class="field">Time (h:mm:ss)<input type="text" inputmode="numeric" data-act="cf" data-f="sec" ${data} value="${c.sec ? fmtDur(c.sec) : ''}" placeholder="30:00" style="width:110px"></label>
      ${def.hasDist ? `<label class="field">Distance (${distUnit(def)})<input type="number" inputmode="decimal" step="any" data-act="cf" data-f="m" ${data} value="${c.m ? Math.round(mToDisp(c.m, def) * 100) / 100 : ''}" style="width:100px"></label>` : ''}
    </div>
    <div class="row" style="margin-top:10px"><span class="muted small">How hard?</span><span class="segs">${['easy', 'moderate', 'hard'].map(e => `<button data-act="cfEffort" data-v="${e}" ${data} class="${(c.effort || 'moderate') === e ? 'sel' : ''}">${e}</button>`).join('')}</span></div>
    <details style="margin-top:8px"><summary class="muted small">More: elevation, heart rate, route</summary><div class="fields">
      ${def.hasDist && (def.cal === 'run' || def.cal === 'walk' || def.cal === 'bike') ? `<label class="field">Elevation gain (${elevUnit()})<input type="number" data-act="cf" data-f="elev" ${data} value="${c.elev ? Math.round(isKg() ? c.elev : c.elev * 3.281) : ''}" style="width:90px"></label>` : ''}
      <label class="field">Avg HR (optional)<input type="number" data-act="cf" data-f="hr" ${data} value="${c.hr || ''}" style="width:90px"></label>
      <label class="field" style="flex:1">Route name<input type="text" data-act="cf" data-f="route" ${data} value="${esc(c.route || '')}" list="routes" placeholder="River loop"></label>
    </div></details>
    <datalist id="routes">${[...new Set(S.history.flatMap(h => h.exercises.map(e => e.cardio && e.cardio.route).filter(Boolean)))].map(r => `<option value="${esc(r)}">`).join('')}</datalist>
    <div class="derived">${c.m && c.sec ? `Pace <b>${paceText(def, c)}</b> · ` : ''}≈ <b>${kcal}</b> kcal = <b>${kcal}</b> XP${def.hasDist && !c.m ? ' · add distance to get pace (and a pace-based calorie count)' : ''}</div>`;
}
function sessionView() {
  const s = S.active;
  if (!s) { view = { name: 'home' }; return homeView(); }
  if (s.circuit) return circuitView() + `<button class="ghost danger" data-act="discard" style="margin-top:16px">Discard workout</button>`;
  const mins = Math.floor((Date.now() - s.started) / 60000), past = s.editing || s.source === 'backfill';
  const counting = s.exercises.some(ex => exerciseCounts(exById(ex.exId), ex));
  return `
    <div class="topbar"><button class="ghost" data-act="home">← Home</button><h1>${esc(s.name)}</h1><button class="primary" data-act="finish">${s.editing ? 'Save' : 'Finish'}</button></div>
    ${past ? `<div class="row" style="margin-bottom:8px"><span class="muted small grow">${s.editing ? 'Editing a past session. XP recalculates when you save; working weights stay put.' : 'Logging a past workout (no rest timer).'}</span><input type="date" data-act="sessDate" value="${isoDate(s.started)}" max="${isoDate(Date.now())}"></div>`
      : `<div class="muted small" style="margin-bottom:6px">Started ${mins} min ago · tap a circle when you finish a set (tap again to count down missed reps) · tap a set's number to remove it</div>`}
    <div class="small" style="margin-bottom:10px;color:${counting ? 'var(--good)' : 'var(--muted)'}">${counting ? '✓ Counts toward your week' : `Counts toward your week once one exercise has ${XPC.streakMin.lifts} work sets (or ${XPC.streakMin.cardioMin} min / 1 mile of cardio)`}</div>
    ${s.exercises.map((ex, ei) => {
      const d = exById(ex.exId);
      if (d.kind === 'cardio') {
        return `<div class="card"><div class="row">${art(d.art)}<div class="grow"><b>${esc(d.name)}</b><div class="muted small">Cardio · typed in</div></div>
          <button class="circle ${ex.cardio.done ? 'done' : ''}" data-act="cardioDone" data-ex="${ei}">${ex.cardio.done ? '✓' : ''}</button>
          <button class="ghost" data-act="exDel" data-ex="${ei}" title="Remove exercise">✕</button></div>
          ${cardioEditor(d, ex.cardio, `data-ex="${ei}"`)}</div>`;
      }
      const st = xs(ex.exId), loaded = isLoaded(d.kind);
      const top = ex.sets.length ? Math.max(...ex.sets.map(s => s.w)) : 0;
      // Warmup and work sets are the same kind of row: editable weight and reps, tap to log, tap the number to remove.
      const row = (s, si, kind) => {
        const data = `data-ex="${ei}" data-set="${si}" data-kind="${kind}"`;
        const cls = s.done ? (s.repsDone >= s.r ? 'done' : 'short') : '';
        const wcell = repsOnly(d.kind) ? '<span class="muted small">Bodyweight</span>'
          : stepper(toDisp(s.w), 'setW', data, '', { typed: true, prefix: d.kind === 'weighted' ? 'BW+' : '' });
        const failq = kind === 'work' && s.done && s.repsDone < s.r && si > 0 && s.toFailure == null
          ? `<div class="failq">Went to failure? <button data-act="fail" data-v="1" ${data}>Yes 💪</button><button class="ghost" data-act="fail" data-v="0" ${data}>No</button></div>` : '';
        return `<div class="set ${kind === 'warm' ? 'warm' : ''}"><button class="n" data-act="rmSet" ${data} title="Remove this set">${kind === 'warm' ? 'W' : si + 1}</button>
          <span>${wcell}${s.flagged ? ' <span title="Confirmed outlier">⚑</span>' : ''}${s.toFailure ? ' <span title="To failure: grit boost">💪</span>' : ''}</span><span>${stepper(s.r, 'setR', data, ` ${repUnit(d)}`)}</span>
          <button class="circle ${cls}" data-act="setDone" ${data}>${s.done ? s.repsDone : `<span style="opacity:.35">${s.r}</span>`}</button></div>${failq}`;
      };
      const sug = ex.warmups.length ? [] : suggestWarmups(top, d);
      const warm = ex.warmups.map((s, si) => row(s, si, 'warm')).join('') + (sug.length && !ex.sets.some(s => s.done)
        ? `<button class="ghost sugwarm" data-act="sugWarm" data-ex="${ei}">+ Suggested warmups: ${sug.map(s => `${fmtW(s.w, d)}×${s.r}`).join(', ')}</button>` : '');
      const work = ex.sets.map((s, si) => row(s, si, 'work')).join('');
      const anyDone = ex.sets.some(s => s.done);
      const banner = !loaded ? '' : ex.deloaded
        ? `<div class="banner info"><span class="grow">Deloaded ${Math.round(XPC.deloadPct * 100)}% for this session. Your miss streak is reset.</span></div>`
        : st.fails >= XPC.suggestDeloadAfter && !anyDone
          ? `<div class="banner"><span class="grow">You missed reps ${st.fails} sessions in a row. Consider a deload to <b>${fmtW(deloadWeight(top, d), d)} ${U()}</b>.</span><button data-act="deload" data-ex="${ei}">Deload</button></div>`
          : '';
      return `<div class="card">
        <div class="row">${art(d.art)}<div class="grow"><b>${esc(d.name)}</b>
          <div class="plan">${ex.sets.length}×${st.prog === 'range' ? `${ex.sets[0] ? ex.sets[0].r : st.repTarget} (range ${st.repMin}–${st.repMax})` : ex.sets[0] ? ex.sets[0].r : 0}${d.kind === 'timed' ? ' sec' : ''}${repsOnly(d.kind) ? '' : ` @ ${fmtW(top, d)} ${U()}${d.impl ? ' each' : ''}`}</div>
          ${d.kind === 'barbell' ? `<div class="plates">${platesPerSide(top, d)} · ${fmtNum(toDisp(barOf(d)))} ${U()} bar</div>` : ''}
          <div class="muted small">${progLine(d, st)}</div></div>
          <button class="ghost" data-act="progress" data-exid="${ex.exId}" title="Progress">📈</button>
          <button class="ghost" data-act="exDel" data-ex="${ei}" title="Remove exercise">✕</button></div>
        ${st.note ? `<div class="note">📌 ${esc(st.note)}</div>` : ''}
        ${banner}
        ${warm}${work}
        <div class="actions">
          <button class="ghost" data-act="addSet" data-ex="${ei}">+ Set</button>
          <button class="ghost" data-act="addWarm" data-ex="${ei}">+ Warmup</button>
          ${ex.warmups.length && !ex.warmups.some(s => s.done) ? `<button class="ghost" data-act="clearWarm" data-ex="${ei}">Clear warmups</button>` : ''}
          <span class="grow"></span>
          ${loaded && !ex.deloaded ? `<button class="ghost" data-act="deload" data-ex="${ei}">Deload −${Math.round(XPC.deloadPct * 100)}%</button>` : ''}
          <button class="ghost" data-act="exSettings" data-exid="${ex.exId}">⚙</button>
        </div>
      </div>`;
    }).join('')}
    <button class="block" data-act="openLib" data-target="session">+ Add exercise</button>
    <h2>Session note</h2>
    <textarea data-act="sessNote" placeholder="Slept badly, gym was packed…">${esc(s.note || '')}</textarea>
    <button class="ghost danger" data-act="discard" style="margin-top:16px">${s.editing ? 'Cancel editing' : 'Discard workout'}</button>`;
}

function stravaCard(def, c, prs) {
  return `<div class="card strava"><div class="row">${art(def.art, 'sm')}<div class="grow"><b>${esc(def.name)}</b>${c.route ? ` <span class="muted small">· ${esc(c.route)}</span>` : ''}<div class="muted small">${c.effort || 'moderate'}</div></div></div>
    <div class="tiles three" style="margin-top:10px">
      ${c.m ? `<div><div class="muted small">Distance</div><div class="big">${fmtDist(c.m, def).replace(/ \w+$/, '')}<small class="muted"> ${distUnit(def)}</small></div></div>` : ''}
      <div><div class="muted small">Time</div><div class="big">${fmtDur(c.sec)}</div></div>
      ${c.m ? `<div><div class="muted small">${def.cal === 'bike' ? 'Speed' : 'Pace'}</div><div class="big" style="font-size:20px">${paceText(def, c)}</div></div>` : ''}
    </div>
    <div class="muted small" style="margin-top:8px">${[c.elev ? `↗ ${Math.round(isKg() ? c.elev : c.elev * 3.281)} ${elevUnit()}` : '', c.hr ? `♥ ${c.hr} bpm` : '', `${Math.round(cardioKcal(def, c, bodyweight() / LB))} kcal`].filter(Boolean).join(' · ')}</div>
    ${prs.length ? `<div style="margin-top:6px">${prs.map(p => `${p.tier === 'all' ? '🏆' : '⭐'} ${esc(p.text.replace(def.name + ': ', ''))}`).join('<br>')}</div>` : ''}</div>`;
}
function sessionBody(h) {
  const R = progression();
  const total = Object.values(h.byStat).reduce((a, b) => a + b, 0) || 1;
  const bars = Object.entries(h.byStat).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="row" style="margin-top:6px"><span style="width:40px" class="small"><b>${k}</b></span><div class="bar grow"><div style="width:${100 * v / total}%"></div></div><span class="small" style="width:36px;text-align:right">${Math.round(v)}</span></div>`).join('');
  const wk = R.weeks.find(w => w.w === weekStart(h.started));
  const ms = muscleSets(h);
  const cardio = h.exercises.filter(e => e.cardio && e.cardio.done && !h.circuit);
  const parts = [h.prXp ? `PR +${h.prXp}` : '', h.gritXp ? `grit 💪 +${h.gritXp}` : '', h.msXp ? `milestones +${h.msXp}` : ''].filter(Boolean);
  const liftPrs = h.prs.filter(p => !cardio.some(e => p.text.startsWith(exById(e.exId).name + ':')));
  return `
    <div class="card">
      <div class="row"><div class="grow"><b>${esc(h.name)}</b>${histIcons(h)}<div class="muted small">${longDate(h.started)} · ${Math.max(1, Math.round(((h.finished || h.started) - h.started) / 60000))} min${h.volume ? ` · ${fmtNum(toDisp(h.volume))} ${U()} volume` : ''} · bodyweight ${fmtNum(toDisp(h.bodyweight))} ${U()}</div></div>
        <span class="chip" style="font-size:16px"><b>+${h.xp}</b> XP</span></div>
      ${parts.length ? `<div class="muted small" style="margin-top:6px">Includes ${parts.join(' · ')}</div>` : ''}
      ${h.milestones.length ? `<div style="margin-top:8px">🎉 Milestone${h.milestones.length > 1 ? 's' : ''}: <b>${esc(h.milestones.join(', '))}</b> (+${XPC.milestoneXp} XP each)</div>` : ''}
      ${liftPrs.length ? `<div style="margin-top:8px">${liftPrs.map(p => `${p.tier === 'all' ? '🏆 All-time' : '⭐ 60-day best'}: ${esc(p.text)}`).join('<br>')}<div class="muted small">PR bonus: +${XPC.prAll * 100}% (all-time) or +${XPC.prRecent * 100}% (60-day) on that exercise's XP</div></div>` : ''}
      <div class="small" style="margin-top:8px;color:${h.counts ? 'var(--good)' : 'var(--muted)'}">${h.counts ? '✓ Counts toward your week' : '✗ Too short to count toward your week (it still earns XP)'}${wk ? ` · that week: ${wk.count}/${S.weeklyTarget}${wk.status === 'hit' ? ` ✓ +${Math.round(wk.bonus * 100)}% consistency bonus` : ''}` : ''}</div>
    </div>
    ${cardio.map(e => stravaCard(exById(e.exId), e.cardio, h.prs.filter(p => p.text.startsWith(exById(e.exId).name + ':')))).join('')}
    <h2>Where your XP went</h2>
    <div class="card">${bars}<div class="muted small" style="margin-top:8px">Each exercise's stat split decides this. FREE points are yours to spend (or bank) on the character sheet.</div></div>
    ${ms.prim.length ? `<h2>Muscles hit</h2><div class="card"><b>${esc(ms.prim.join(', '))}</b>${ms.sec.length ? `<div class="muted small">Also: ${esc(ms.sec.join(', '))}</div>` : ''}</div>` : ''}`;
}
function summaryView() {
  const h = S.history.find(h => h.id === view.id);

}
function histView() {
  const h = S.history.find(h => h.id === view.id);

// Rest timer: counts down from the exercise's own rest time. −15s/+15s save to that exercise.
function renderRest() {
  const el = $('#rest');
  if (!rest || view.name !== 'session') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const left = Math.ceil(rest.target - (Date.now() - rest.start) / 1000);
  $('#restTime').textContent = fmtClock(Math.max(0, left));
  $('#restTime').style.color = left <= 0 ? 'var(--good)' : '';
  $('#restLabel').textContent = left <= 0 ? 'Rest done: next set!' : `Resting · ${exById(rest.exId).name} ${fmtClock(rest.target)}`;
  if (left <= 0 && !rest.buzzed) { rest.buzzed = true; beep(880, 300); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} }
}
function adjustRest(delta) {
  if (!rest) return;
  const st = xs(rest.exId);
  st.restSec = Math.min(600, Math.max(15, st.restSec + delta));
  rest.target = st.restSec;
  save(); renderRest();
}
setInterval(() => { if (rest) renderRest(); }, 250);
$('#restSkip').onclick = () => { rest = null; renderRest(); };
$('#restMinus').onclick = () => adjustRest(-15);
$('#restPlus').onclick = () => adjustRest(15);

// ---------------------------------------------------------------------------
// Typo / sanity guard: ask before saving a number that looks wrong. Confirmed outliers keep a flag.
// ---------------------------------------------------------------------------
function guardWeight(def, exId, lb) {
  const st = xs(exId);
  let best = st.weight;
  for (const h of S.history) for (const e of h.exercises) if (e.exId === exId && e.sets) for (const s of e.sets) if (s.done) best = Math.max(best, s.w);
  if (best > 0 && lb > best * (1 + XPC.guard.weightJump) && toDisp(lb) >= 20) {
    const tenth = toDisp(lb) / 10;
    return confirm(`${fmtW(lb, def)} ${U()} looks high for ${def.name} (your working weight is ${fmtW(st.weight, def)}). Did you mean ${fmtNum(tenth)}?\n\nOK = keep ${fmtW(lb, def)} (it gets a ⚑ flag) · Cancel = go back`) ? 'flag' : false;
  }
  return 'ok';
}

// Export: CSV of every set, or everything as JSON

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['date', 'workout', 'exercise', 'set', 'warmup', `weight_${U()}`, 'reps_target', 'reps_done', 'to_failure', 'flagged', 'distance_m', 'duration_s', 'effort', 'route', 'session_xp', 'note'].join(',')];
  for (const h of [...S.history].reverse()) for (const e of h.exercises) {
    const d = exById(e.exId);
    if (e.cardio) rows.push([isoDate(h.started), q(h.name), q(d.name), 1, 0, '', '', '', '', '', Math.round(e.cardio.m || 0), e.cardio.sec || 0, e.cardio.effort || '', q(e.cardio.route), h.xp, q(h.note)].join(','));
    else [...(e.warmups || []).map(s => [s, 1]), ...e.sets.map(s => [s, 0])].forEach(([s, w], i) =>
      rows.push([isoDate(h.started), q(h.name), q(d.name), i + 1, w, toDisp(s.w), s.r, s.repsDone ?? '', s.toFailure ? 1 : 0, s.flagged ? 1 : 0, '', '', '', '', h.xp, q(h.note)].join(',')));

}

const defaultReps = def => def.kind === 'timed' ? 30 : def.kind === 'bodyweight' ? 10 : def.kind === 'weighted' ? 8 : ['barbell'].includes(def.kind) ? 5 : 10;

// Cardio field edits (session card or quick-log sheet), with the sanity guard on pace.
function setCardioField(c, def, f, raw) {
  if (f === 'sec') { const v = parseDur(raw); if (v != null) c.sec = v; }
  else if (f === 'm') c.m = raw === '' ? 0 : dispToM(parseFloat(raw) || 0, def);
  else if (f === 'elev') c.elev = raw === '' ? 0 : (parseFloat(raw) || 0) / (isKg() ? 1 : 3.281);
  else if (f === 'hr') c.hr = parseInt(raw) || null;
  else if (f === 'route') c.route = raw.trim();
  if ((f === 'sec' || f === 'm') && c.m && c.sec && (def.cal === 'run' || def.cal === 'walk') && c.sec / (c.m / 1609.34) < XPC.guard.fastestMileSec) {
    if (!confirm(`That's ${paceText(def, c)}, faster than the mile world record. Keep it?`)) { if (f === 'm') c.m = 0; else c.sec = 0; }

}

function handle(act, el, ev) {
  const d = +el.dataset.d || 0;
  const t = view.name === 'edit' ? S.templates.find(t => t.id === view.id) : null;
  const item = t && el.dataset.item ? t.items.find(i => i.id === el.dataset.item) : null;
  const ex = S.active && el.dataset.ex != null && el.dataset.ex !== 'q' ? S.active.exercises[+el.dataset.ex] : null;
  const def = ex ? exById(ex.exId) : item ? exById(item.exId) : el.dataset.exid ? exById(el.dataset.exid) : null;
  const est = el.dataset.exid ? xs(el.dataset.exid) : null;
  switch (act) {
    case 'home': view = { name: 'home' }; break;
    case 'char': view = { name: 'char' }; break;
    case 'cal': view = { name: 'cal', offset: 0 }; break;
    case 'calNav': view.offset = (view.offset || 0) + d; break;
    case 'resume': view = { name: 'session' }; break;
    case 'start': startSession(S.templates.find(t => t.id === el.dataset.id)); return;
    case 'edit': view = { name: 'edit', id: el.dataset.id }; break;
    case 'newTemplate': { const nt = { id: uid(), name: `Workout ${String.fromCharCode(65 + S.templates.length)}`, items: [] }; S.templates.push(nt); view = { name: 'edit', id: nt.id }; break; }
    case 'delTemplate': if (confirm('Delete this workout?')) { S.templates = S.templates.filter(x => x !== t); view = { name: 'home' }; } break;
    case 'sample': if (confirm('Replace your data with 8 weeks of sample workouts?')) loadSample(); return;
    case 'progress': view = { name: 'progress', exId: el.dataset.exid }; modal = null; break;
    case 'reset': if (confirm('Reset all demo data?')) { S = seed(); rest = null; view = { name: 'home' }; } break;
    case 'export': if (el.dataset.v === 'csv') exportCsv(); else download(`barbell-brawl-${isoDate(Date.now())}.json`, JSON.stringify(S, null, 2), 'application/json'); return;
    // settings
    case 'units': {
      const to = el.dataset.v; if (to === S.units) return;
      for (const [id, st] of Object.entries(S.exState)) {   // swap the standard bars and round working weights to the new unit's steps
        if (st.bar != null && Math.abs(st.bar - defaultBar()) < 1) st.bar = to === 'kg' ? 20 * LB : 45;
      }
      S.units = to;
      for (const [id, st] of Object.entries(S.exState)) { const e = exById(id); if (st.weight) st.weight = roundToStep(st.weight, e); if (st.inc) st.inc = defaultInc(e); }
      break;
    }
    case 'plate': { const p = +el.dataset.p, inv = S.plates[U()]; S.plates[U()] = inv.includes(p) ? (inv.length > 1 ? inv.filter(x => x !== p) : inv) : [...inv, p]; break; }
    case 'restDef': S.restSec = Math.min(600, Math.max(15, S.restSec + d * 15)); break;
    case 'target': S.weeklyTarget = Math.min(7, Math.max(1, S.weeklyTarget + d)); break;
    // bodyweight
    case 'bwLog': modal = { name: 'bw', w: fmtNum(toDisp(bodyweight())).replace(/,/g, ''), t: Date.now() }; break;
    case 'bwVal': modal.w = stepValue(el, parseFloat(modal.w) || 0, isKg() ? 0.5 : 1, 20); break;
    case 'bwSave': {
      const lb = fromDisp(parseFloat(modal.w)), prev = bwAt(modal.t);
      if (!lb) return;
      if (Math.abs(lb - prev) / prev > XPC.guard.bwJump && !confirm(`${fmtNum(toDisp(prev))} → ${fmtNum(toDisp(lb))} ${U()}? That's a big change. Keep it?`)) return;
      S.bwLog = S.bwLog.filter(e => isoDate(e.t) !== isoDate(modal.t)); S.bwLog.push({ t: dayStart(modal.t), w: lb });
      rescoreAll(); modal = null; toast('Bodyweight logged'); break;
    }
    // character
    case 'spend': { const R = progression(); if (freeAvail(R) > 0) S.freeSpent[el.dataset.k] = (S.freeSpent[el.dataset.k] || 0) + 1; break; }
    case 'unspend': if (confirm('Put all spent FREE points back in the bank?')) S.freeSpent = {}; break;
    // quick log and backfill
    case 'quickLog': modal = { name: 'lib', target: 'quick' }; break;
    case 'qStar': { const id = el.dataset.id; S.starred = S.starred.includes(id) ? S.starred.filter(x => x !== id) : [...S.starred, id]; break; }
    case 'qSave': saveQuickCardio(); return;
    case 'backfill': modal = { name: 'backfill', t: Date.now() - DAY }; break;
    case 'bfStart': {
      const tpl = S.templates.find(x => x.id === el.dataset.id);
      S.active = newSession({ templateId: tpl.id, name: tpl.name, started: dayStart(modal.t) + 18 * 3600000, source: 'backfill', exercises: tpl.items.map(sessionExercise) });
      modal = null; view = { name: 'session' }; break;
    }
    // history
    case 'openHist': view = { name: 'hist', id: el.dataset.id }; break;
    case 'editHist': {
      const h = S.history.find(x => x.id === el.dataset.id);
      S.active = { ...structuredClone(h), editing: h.id }; view = { name: 'session' }; break;
    }
    case 'delHist': if (confirm('Delete this session? Its XP comes out too (levels never drop; any shortfall becomes XP debt).')) { S.history = S.history.filter(h => h.id !== el.dataset.id); rescoreAll(); view = { name: 'home' }; } break;
    // template editing
    case 'itemSets': item.sets = Math.max(1, item.sets + d); break;
    case 'itemReps': item.reps = Math.max(1, item.reps + d * (exById(item.exId).kind === 'timed' ? 5 : 1)); break;
    // circuits
    case 'cRounds': t.rounds = Math.min(20, Math.max(1, t.rounds + d)); break;
    case 'cWork': t.workSec = Math.min(900, Math.max(15, t.workSec + d * 15)); break;
    case 'cTrans': t.transSec = Math.min(300, Math.max(0, t.transSec + d * 5)); break;
    case 'itemCW': item.w = fromDisp(stepValue(el, toDisp(item.w || 0), wStep(def))); break;
    case 'cReps': { const c = S.active.c; c.log[+el.dataset.r][+el.dataset.s] = Math.max(0, c.log[+el.dataset.r][+el.dataset.s] + d); break; }
    case 'cPause': {

    }
    case 'cSkip': { const now = circuitNow(S.active); if (!now.done) S.active.c.start -= now.left * 1000 + 50; audio(); save(); circuitTick(); return; }
    // per-exercise memory (from the editor, a session, or the settings sheet)
    case 'star': { const st = S.templates.find(x => x.id === el.dataset.id); st.favorite = !st.favorite; break; }
    case 'exW': est.weight = fromDisp(stepValue(el, toDisp(est.weight), wStep(def))); break;
    case 'exInc': est.inc = fromDisp(Math.max(0, toDisp(est.inc) + d * (isKg() ? 1.25 : 2.5))); break;
    case 'exBar': est.bar = fromDisp(stepValue(el, toDisp(est.bar), isKg() ? 5 : 5)); break;
    case 'exRest': est.restSec = Math.min(600, Math.max(15, est.restSec + d * 15)); break;

    case 'exRepMax': est.repMax = Math.max(est.repMin, est.repMax + d); est.repTarget = Math.min(est.repMax, est.repTarget); break;
    case 'exRepT': est.repTarget = Math.max(est.repMin, Math.min(est.repMax, est.repTarget + d)); break;
    case 'exSettings': modal = { name: 'exSettings', exId: el.dataset.exid }; break;
    case 'deloadEx': {

      if (live) deloadSessionExercise(live); else { est.weight = deloadWeight(est.weight, def); est.fails = 0; }

    case 'itemMin': item.minutes = Math.max(5, (item.minutes || 30) + d * 5); break;
    case 'itemDel': t.items = t.items.filter(i => i !== item); break;
    case 'itemUp': { const k = t.items.indexOf(item); if (k > 0) [t.items[k - 1], t.items[k]] = [t.items[k], t.items[k - 1]]; break; }
    // session logging
    case 'setW': {
      const arr = el.dataset.kind === 'warm' ? ex.warmups : ex.sets, si = +el.dataset.set;
      const old = arr[si].w, nw = fromDisp(stepValue(el, toDisp(old), wStep(def)));
      let flag = false;
      if (el.dataset.in != null && el.dataset.kind !== 'warm') { const g = guardWeight(def, ex.exId, nw); if (!g) break; flag = g === 'flag'; }
      if (el.dataset.kind === 'warm') arr[si].w = nw;
      // Changing a work set also updates the later, not-yet-done work sets at the same weight.
      else arr.forEach((s, k) => { if (k === si || (k > si && !s.done && Math.abs(s.w - old) < 0.01)) { s.w = nw; if (flag) s.flagged = true; else if (k === si) s.flagged = false; } });
      break;
    }
    case 'setR': {
      const s = (el.dataset.kind === 'warm' ? ex.warmups : ex.sets)[+el.dataset.set];
      const nr = Math.max(1, s.r + d * (def.kind === 'timed' ? 5 : 1));
      const limit = def.kind === 'timed' ? XPC.guard.maxHoldSec : XPC.guard.maxReps;
      if (nr > limit && s.r <= limit && !confirm(`${nr} ${repUnit(def)} in one set? Keep it (it gets a ⚑ flag)?`)) break;
      if (nr > limit) s.flagged = true;
      s.r = nr; break;
    }
    case 'setDone': {
      const s = (el.dataset.kind === 'warm' ? ex.warmups : ex.sets)[+el.dataset.set];
      if (!s.done) { s.done = true; s.repsDone = s.r; }
      else if (s.repsDone > 0) { s.repsDone--; if (s.repsDone >= s.r) s.toFailure = undefined; }
      else { s.done = false; s.repsDone = null; s.toFailure = undefined; }
      if (s.done && el.dataset.kind !== 'warm' && !S.active.editing && S.active.source !== 'backfill') rest = { start: Date.now(), target: xs(ex.exId).restSec, exId: ex.exId };
      break;
    }
    case 'fail': {
      const s = ex.sets[+el.dataset.set];
      s.toFailure = el.dataset.v === '1';
      if (s.toFailure) { toast(`GRIT! 💪 +${XPC.grit * 100}% XP on that set`); try { navigator.vibrate && navigator.vibrate([40, 30, 80]); } catch {} }
      break;
    }
    case 'rmSet': {
      const arr = el.dataset.kind === 'warm' ? ex.warmups : ex.sets;
      // Warmups are cheap to re-add, so they go without a confirm.
      if (el.dataset.kind === 'warm' || confirm(`Remove set ${+el.dataset.set + 1}?`)) arr.splice(+el.dataset.set, 1);
      break;
    }
    case 'clearWarm': ex.warmups = []; break;
    case 'addSet': { const lastSet = ex.sets[ex.sets.length - 1] || { w: isLoaded(def.kind) ? xs(ex.exId).weight : 0, r: defaultReps(def) }; ex.sets.push(newSet(lastSet.w, lastSet.r)); break; }
    case 'addWarm': {
      // Barbell: the next plate jump above the last warmup (capped at the work weight). Otherwise repeat the last one.
      const prev = ex.warmups[ex.warmups.length - 1];
      const top = Math.max(...ex.sets.map(s => s.w), 0);
      const w = def.kind !== 'barbell' ? (prev ? prev.w : 0)
        : !prev ? barOf(def) : Math.min(plateJumps(def).find(j => j > prev.w + 0.01) ?? prev.w, Math.max(top, prev.w));
      ex.warmups.push(newSet(w, WARMUP_REPS)); break;
    }
    case 'sugWarm': { const top = Math.max(...ex.sets.map(s => s.w), 0); ex.warmups = suggestWarmups(top, def).map(s => newSet(s.w, s.r)); break; }
    case 'libCat': modal.cat = el.dataset.cat; break;
    case 'exDel': if (confirm(`Remove ${def.name} from this workout?`)) S.active.exercises.splice(+el.dataset.ex, 1); break;
    case 'cardioDone': ex.cardio.done = !ex.cardio.done; break;
    case 'cfEffort': (el.dataset.ex === 'q' ? modal.c : ex.cardio).effort = el.dataset.v; break;
    case 'finish': finishSession(); return;
    case 'discard': if (confirm(S.active.editing ? 'Stop editing? Your changes are dropped.' : 'Discard this workout? Nothing will be saved.')) { const back = S.active.editing; S.active = null; rest = null; lastCue = null; wakeLock(false); view = back ? { name: 'hist', id: back } : { name: 'home' }; } break;
    // library
    case 'openLib': modal = { name: 'lib', target: el.dataset.target }; break;
    case 'closeModal': if (ev.target === el) modal = null; else return; break;
    case 'pickEx': {
      const picked = exById(el.dataset.id);
      if (modal.target === 'quick') { quickPick(picked); break; }
      if (modal.target === 'template') addToTemplate(S.templates.find(t => t.id === view.id), picked); else addToSession(picked);
      modal = null; break;
    }
    case 'customForm': modal = { name: 'custom', target: modal.target, draft: { name: '', kind: 'barbell', stat: 'STR', art: 'generic', m: {} } }; break;
    case 'cArt': modal.draft.art = el.dataset.k; break;
    case 'cMuscle': { const m = modal.draft.m, k = el.dataset.k; m[k] = !m[k] ? 'p' : m[k] === 'p' ? 's' : undefined; break; }
    case 'cSave': {
      const c = modal.draft, mg = k => Object.keys(c.m).filter(x => c.m[x] === k).join(' ');
      const nd = { id: 'c_' + uid(), name: c.name.trim(), kind: c.kind, art: c.art, inc: c.kind === 'weighted' ? 2.5 : 5, met: 6, cal: 'met', dist: { [c.stat]: 90, FREE: 10 }, m: `${mg('p')}|${mg('s')}`, isCustom: true };
      S.custom.push(nd);
      if (modal.target === 'quick') { quickPick(nd); break; }
      if (modal.target === 'template') addToTemplate(S.templates.find(t => t.id === view.id), nd); else addToSession(nd);
      modal = null; break;
    }
    default: return;
  }
  save(); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  if (el.closest('[data-stop]') && el.dataset.act === 'closeModal' && el.classList.contains('modal')) return;
  handle(el.dataset.act, el, e);
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  if (!act) return;
  if (el.dataset.in != null) { handle(act, el, e); return; }   // typed weight
  const t = view.name === 'edit' ? S.templates.find(t => t.id === view.id) : null;
  if (act === 'circuitToggle') {
    t.circuit = el.checked;
    if (t.circuit) {
      t.rounds ??= 3; t.workSec ??= 120; t.transSec ??= 30;
      t.items.forEach(it => { const d = exById(it.exId); it.w ??= isLoaded(d.kind) ? xs(it.exId).weight : 0; it.reps ??= defaultReps(d); });
    }
  }
  else if (act === 'voice') S.voice = el.checked;
  else if (act === 'exAuto') xs(el.dataset.exid).autoInc = el.checked;
  else if (act === 'exNote') { xs(el.dataset.exid).note = el.value.trim(); save(); return; }
  else if (act === 'rename') t.name = el.value.trim() || t.name;
  else if (act === 'cKind') modal.draft.kind = el.value;
  else if (act === 'cStat') modal.draft.stat = el.value;
  else if (act === 'sessNote') { S.active.note = el.value; save(); return; }
  else if (act === 'histNote') { const h = S.history.find(h => h.id === el.dataset.id); if (h) h.note = el.value; save(); return; }
  else if (act === 'sessDate' && el.value) { const s = S.active, dt = fromIso(el.value); if (dt > Date.now()) return; const dur = (s.finished || s.started) - s.started; s.started = dt + 18 * 3600000; if (s.finished) s.finished = s.started + dur; }
  else if (act === 'bwDate' && el.value) { modal.t = fromIso(el.value); return; }
  else if (act === 'bfDate' && el.value) { modal.t = fromIso(el.value); return; }
  else if (act === 'qDate' && el.value) { modal.t = fromIso(el.value); return; }
  else if (act === 'cf') {
    const q = el.dataset.ex === 'q', c = q ? modal.c : S.active.exercises[+el.dataset.ex].cardio;
    const def = exById(q ? modal.exId : S.active.exercises[+el.dataset.ex].exId);
    setCardioField(c, def, el.dataset.f, el.value);
    if (!q && c.sec) c.done = true;
  }
  else return;
  save(); render();
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'libQ' && modal) { modal.q = e.target.value; $('#libgrid').innerHTML = libGrid(); return; }
  if (e.target.dataset.act === 'cName' && modal) {
    modal.draft.name = e.target.value;
    const btn = document.querySelector('[data-act="cSave"]'); if (btn) btn.disabled = !e.target.value.trim();
  }
});

rescoreAll();
render();
</script>
</body>
</html>
