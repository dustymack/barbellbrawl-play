<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Prototype</title>
<!--
  Barbell Brawl – throwaway prototype of the workout tracker (StrongLifts / Jefit style).
  Saved workouts, auto warmups, tap-to-log sets, auto-increment, and XP/stat preview.
  Data lives in this browser's localStorage only. "Reset demo data" on the home screen clears it.
-->
<style>
  :root {
    --bg: #121416; --card: #1c1f23; --card2: #24282d; --line: #33373d; --text: #eceae4; --muted: #9a9ca0;
    --accent: #ff7a1a; --good: #5cc97b; --warn: #e8c547; --bad: #e0555a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { max-width: 480px; margin: 0 auto; padding: 12px 16px 120px; }
  h1 { font-size: 20px; margin: 4px 0 12px; letter-spacing: .5px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 12px; }
  button { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  button.ghost { background: none; border-color: transparent; color: var(--muted); padding: 6px 8px; white-space: nowrap; }
  button.danger { color: var(--bad); }
  button.block { width: 100%; }
  input[type=text], input[type=number], select { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=text] { width: 100%; }
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .topbar h1 { margin: 0; flex: 1; }
  .art { width: 56px; height: 56px; flex: none; color: var(--text); background: var(--card2); border-radius: 10px; }
  .art.sm { width: 44px; height: 44px; }
  .art svg { width: 100%; height: 100%; display: block; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .stepper button { border: 0; border-radius: 0; padding: 6px 10px; background: var(--card2); min-width: 32px; }
  .stepper span { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; padding: 0 2px; }
  .stepper small { color: var(--muted); font-weight: 400; }
  .stepper input { width: 52px; background: none; border: 0; color: var(--text); font: inherit; font-weight: 600; text-align: center; padding: 6px 0; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .stepper span { display: inline-flex; align-items: center; justify-content: center; }
  .field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .fields { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .toggles label { display: flex; align-items: center; gap: 6px; }
  .set { display: grid; grid-template-columns: 26px 1fr auto 50px; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #2a2e33; }
  .set .n { color: var(--muted); font-weight: 700; text-align: center; }
  .set.warm .n { color: var(--muted); font-size: 12px; }
  .set.warm { opacity: .8; }
  .circle { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: none; padding: 0; font-weight: 800; font-size: 17px; color: var(--muted); }
  .circle.done { background: var(--good); border-color: var(--good); color: #0d1a10; }
  .circle.short { background: var(--warn); border-color: var(--warn); color: #1a150d; }
  .set.warm .circle { width: 38px; height: 38px; font-size: 14px; }
  .plan { font-weight: 600; }
  .plates { font-size: 12px; color: var(--muted); }
  .bar { height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); }
  .chip b { color: var(--accent); }
  #rest { position: fixed; left: 0; right: 0; bottom: 0; background: #0c0d0f; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: none; }
  #rest .inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  #rest .t { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px; border: 1px solid var(--line); }
  .libgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .libitem { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-size: 12px; text-align: center; }
  .libitem .art { width: 64px; height: 64px; }
  .artpick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .artpick button { padding: 2px; }
  .artpick button.sel { border-color: var(--accent); }
  .next { border-color: var(--accent); }
  .tag { font-size: 11px; font-weight: 700; color: #111; background: var(--accent); border-radius: 6px; padding: 2px 6px; }
  .set .n { padding: 0; background: none; border: 0; color: var(--muted); font-weight: 700; text-align: center; height: 32px; }
  .sugwarm { display: block; width: 100%; text-align: left; color: var(--accent); padding: 8px 0; white-space: normal; border-top: 1px solid #2a2e33; border-radius: 0; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 8px; }
  .chip { color: var(--text); cursor: pointer; }
  .chip.sel { border-color: var(--accent); background: rgba(255,122,26,.15); }
  #rest .inner button { padding: 8px 10px; }
  .prow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; }
  .up { color: #0ca30c; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .chartwrap { position: relative; }
  .chartwrap svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .ax { fill: #898781; font-size: 11px; font-variant-numeric: tabular-nums; }
  .lbl { fill: #c3c2b7; font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .tip { position: absolute; top: 2px; display: none; pointer-events: none; background: #0c0d0f; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; z-index: 2; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  details.card summary { cursor: pointer; color: var(--muted); }
  table.log { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  table.log th, table.log td { text-align: left; padding: 5px 4px; border-top: 1px solid #2a2e33; vertical-align: top; }
  table.log th { color: var(--muted); font-weight: 600; }
  .art.lg { width: 88px; height: 88px; }
  .cphase { text-align: left; border-width: 2px; }
  .cphase.work { border-color: var(--good); }
  .cphase.trans, .cphase.ready { border-color: var(--warn); }
  .clabel { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }
  .cphase.work .clabel { color: var(--good); }
  .ctime { font-size: 72px; font-weight: 800; line-height: 1.05; margin: 4px 0 8px; }
  .cphase .bar > div { transition: width .2s linear; }
  .cphase.work .bar > div { background: var(--good); }
  .cphase.trans .bar > div, .cphase.ready .bar > div { background: var(--warn); }
  .cgrid { display: grid; gap: 4px; }
  .cgrid span { height: 10px; border-radius: 3px; background: var(--card2); border: 1px solid var(--line); }
  .cgrid span.did { background: var(--good); border-color: var(--good); }
  .cgrid span.cur { background: var(--accent); border-color: var(--accent); }
  .star { font-size: 20px; padding: 4px 6px; color: var(--muted); }
  .star.on { color: var(--warn); }
  .banner { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: rgba(232,197,71,.12); border: 1px solid rgba(232,197,71,.4); font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .banner.info { background: rgba(92,201,123,.1); border-color: rgba(92,201,123,.35); }
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"><div class="inner">
  <div class="grow"><div class="muted small" id="restLabel">Rest</div><div class="t" id="restTime">2:00</div></div>
  <button id="restMinus">−15s</button><button id="restPlus">+15s</button><button id="restSkip">Skip</button>
</div></div>
<div id="modalRoot"></div>

<script>
// ---------------------------------------------------------------------------
// Exercise art: tiny side-view stick figures, 64×64. Plates are drawn as discs.
// ---------------------------------------------------------------------------
const ART = {
  squat: `<circle cx="34" cy="14" r="4.5"/><circle cx="30" cy="21" r="7" class="plate"/><path d="M31 21 L27 35 L39 38 L36 57"/><path d="M27 35 L37 39"/><path d="M30 23 L36 26 L32 22"/>`,
  bench: `<path d="M8 44 H50 M14 44 V56 M44 44 V56"/><circle cx="12" cy="39" r="4.5"/><path d="M17 40 H40 L46 48 L46 57"/><path d="M22 40 V25"/><circle cx="22" cy="23" r="7" class="plate"/>`,
  deadlift: `<circle cx="44" cy="20" r="4.5"/><path d="M40 25 L23 36 L31 46 L29 57"/><path d="M39 26 L38 44"/><circle cx="38" cy="50" r="8" class="plate"/>`,
  row: `<circle cx="48" cy="24" r="4.5"/><path d="M44 28 L22 36 L28 46 L25 57"/><path d="M42 29 L44 38 L38 39"/><circle cx="38" cy="42" r="7" class="plate"/>`,
  ohp: `<circle cx="33" cy="19" r="4.5"/><path d="M32 24 L32 40 L28 57 M32 40 L36 57"/><path d="M32 26 L27 16 L30 8 M32 26 L37 16 L34 8"/><circle cx="32" cy="7" r="6" class="plate"/>`,
  pullup: `<path d="M6 8 H58"/><path d="M24 8 L27 20 M40 8 L37 20"/><circle cx="32" cy="16" r="4.5"/><path d="M27 21 H37 M32 21 V38 L28 50 M32 38 L36 50"/><path d="M32 38 V44"/><circle cx="32" cy="48" r="4.5" class="plate"/>`,
  dip: `<path d="M12 32 H52 M16 32 V57 M48 32 V57"/><circle cx="32" cy="10" r="4.5"/><path d="M32 15 V35 L26 44 L31 52 M28 18 L27 32 M36 18 L37 32"/><circle cx="32" cy="40" r="4" class="plate"/>`,
  lunge: `<circle cx="30" cy="12" r="4.5"/><path d="M30 17 V36 L41 45 L41 57 M30 36 L22 54 L13 56"/><path d="M30 20 L26 36 M30 20 L34 36"/><path d="M23 36 H29 M31 36 H37" class="thick"/>`,
  curl: `<circle cx="30" cy="12" r="4.5"/><path d="M30 17 V38 L26 57 M30 38 L34 57"/><path d="M30 20 L30 32 L38 24"/><circle cx="40" cy="23" r="5" class="plate"/>`,
  run: `<circle cx="36" cy="12" r="4.5"/><path d="M34 17 L28 35 L38 44 L34 56 M28 35 L18 42 L12 38"/><path d="M33 20 L42 27 L46 22 M33 20 L24 25 L20 32"/>`,
  bike: `<circle cx="16" cy="46" r="10"/><circle cx="48" cy="46" r="10"/><path d="M16 46 L28 30 L44 30 L48 46 M28 30 L34 46 L44 30"/><circle cx="36" cy="10" r="4.5"/><path d="M34 15 L28 28 L34 38 M33 18 L44 28"/>`,
  walk: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L26 56 M32 36 L38 56"/><path d="M32 20 L27 33 M32 20 L37 33"/>`,
  press: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L27 56 M32 36 L37 56"/><path d="M32 21 L22 20 M32 21 L42 20"/><path d="M18 18 V23 M46 18 V23" class="thick"/>`,
  core: `<path d="M8 56 H56"/><circle cx="14" cy="44" r="4.5"/><path d="M19 46 L34 50 L44 42 L52 55"/><path d="M20 47 L24 36"/>`,
  pushup: `<path d="M6 57 H58"/><circle cx="12" cy="39" r="4.5"/><path d="M17 41 L54 54"/><path d="M21 43 L20 56"/>`,
  bwsquat: `<circle cx="34" cy="14" r="4.5"/><path d="M31 19 L27 35 L39 38 L36 57"/><path d="M27 35 L37 39"/><path d="M30 23 L46 25"/>`,
  invrow: `<path d="M6 57 H58 M8 22 H30 M12 22 V57"/><circle cx="22" cy="31" r="4.5"/><path d="M24 36 L54 55"/><path d="M28 38 L22 22"/>`,
  legraise: `<path d="M6 8 H58"/><path d="M27 8 L29 20 M37 8 L35 20"/><circle cx="32" cy="15" r="4.5"/><path d="M32 20 V38 L52 34"/>`,
  burpee: `<path d="M12 57 H52"/><circle cx="32" cy="16" r="4.5"/><path d="M32 21 V38 L27 50 M32 38 L37 50"/><path d="M32 24 L24 11 M32 24 L40 11"/>`,
  plank: `<path d="M6 57 H58"/><circle cx="13" cy="41" r="4.5"/><path d="M18 44 L54 54"/><path d="M21 45 L22 56 L32 56"/>`,
  pulldown: `<path d="M14 5 H50 M32 5 V13 M20 13 H44"/><circle cx="32" cy="24" r="4.5"/><path d="M25 14 L27 28 M39 14 L37 28"/><path d="M32 29 V42 H44 V56 M22 44 H40"/>`,
  legpress: `<path d="M6 57 H58 M8 50 H28"/><circle cx="12" cy="39" r="4.5"/><path d="M16 43 L26 50 L38 38 L48 44"/><path d="M48 30 L56 48" class="thick"/>`,
  pushdown: `<path d="M44 4 V22"/><circle cx="30" cy="12" r="4.5"/><path d="M30 17 V38 L26 57 M30 38 L34 57"/><path d="M30 21 L36 31 L44 30 L44 22"/>`,
  raise: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L27 56 M32 36 L37 56"/><path d="M32 21 L16 22 M32 21 L48 22"/><path d="M13 19 V25 M51 19 V25" class="thick"/>`,
  swing: `<circle cx="43" cy="18" r="4.5"/><path d="M39 23 L24 34 L30 45 L28 57"/><path d="M38 24 L49 34"/><circle cx="51" cy="38" r="5" class="plate"/>`,
  clean: `<circle cx="30" cy="12" r="4.5"/><circle cx="38" cy="21" r="6.5" class="plate"/><path d="M30 17 V38 L26 57 M30 38 L34 57"/><path d="M30 21 L35 27 L38 21"/>`,
  hipthrust: `<path d="M6 57 H58 M8 40 H20 M10 40 V57"/><circle cx="12" cy="34" r="4.5"/><path d="M16 38 L34 34 L44 44 L44 57"/><circle cx="32" cy="28" r="5.5" class="plate"/>`,
  rower: `<path d="M6 57 H58 M10 50 H54"/><circle cx="24" cy="22" r="4.5"/><path d="M23 27 L20 44 L34 38 L40 48 M23 30 L42 34"/><circle cx="50" cy="40" r="7"/>`,
  swim: `<circle cx="14" cy="32" r="4.5"/><path d="M19 34 L46 37 L56 33 M24 34 L32 24 L40 22"/><path d="M6 46 Q14 42 22 46 T38 46 T54 46"/>`,
  rope: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L28 50 M32 36 L36 50"/><path d="M32 20 L22 30 M32 20 L42 30"/><path d="M22 30 Q32 64 42 30"/>`,
  yoga: `<path d="M12 57 H52"/><circle cx="32" cy="10" r="4.5"/><path d="M32 15 V57 M32 36 L41 42 L32 46"/><path d="M32 19 L27 5 M32 19 L37 5"/>`,
  generic: `<circle cx="32" cy="12" r="4.5"/><path d="M32 17 V36 L27 56 M32 36 L37 56"/><path d="M32 21 L24 34 M32 21 L40 34"/><path d="M20 34 H28 M36 34 H44" class="thick"/>`,
};
function art(key, cls = '') {
  return `<div class="art ${cls}"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <style>.plate{fill:#ff7a1a;stroke:#ff7a1a}.thick{stroke-width:5}</style>${ART[key] || ART.generic}</svg></div>`;
}

// ---------------------------------------------------------------------------
// Exercise library. Stat splits = the settled B14 table in docs/04 (2026-09-25). Keep in sync with balance-sim.html.
// kind: barbell | dumbbell | kettlebell | machine | weighted (bodyweight + added load)
//       | bodyweight (reps only) | timed (seconds) | cardio (minutes)
// bw: fraction of bodyweight moved per rep, used for XP volume (e.g. a push-up moves ~65% of you)
// ---------------------------------------------------------------------------
const X = (id, name, kind, art, dist, extra = {}) => ({ id, name, kind, art, dist, ...extra });
const LIB = [
  // Barbell
  X('squat', 'Barbell Back Squat', 'barbell', 'squat', { STR: 70, END: 15, DEX: 5, FREE: 10 }, { inc: 5 }),
  X('frontsquat', 'Front Squat', 'barbell', 'squat', { STR: 70, DEX: 20, FREE: 10 }, { inc: 5 }),
  X('bench', 'Bench Press', 'barbell', 'bench', { STR: 90, FREE: 10 }, { inc: 5 }),
  X('incline', 'Incline Bench Press', 'barbell', 'bench', { STR: 85, DEX: 5, FREE: 10 }, { inc: 5 }),
  X('row', 'Barbell Row', 'barbell', 'row', { STR: 75, DEX: 15, FREE: 10 }, { inc: 5 }),
  X('deadlift', 'Deadlift', 'barbell', 'deadlift', { STR: 75, END: 10, DEX: 5, FREE: 10 }, { inc: 10 }),
  X('rdl', 'Romanian Deadlift', 'barbell', 'deadlift', { STR: 70, DEX: 20, FREE: 10 }, { inc: 5 }),
  X('ohp', 'Overhead Press', 'barbell', 'ohp', { STR: 70, DEX: 20, FREE: 10 }, { inc: 5 }),
  X('clean', 'Power Clean', 'barbell', 'clean', { SPD: 45, STR: 35, DEX: 10, FREE: 10 }, { inc: 5 }),
  X('hipthrust', 'Hip Thrust', 'barbell', 'hipthrust', { STR: 75, SPD: 15, FREE: 10 }, { inc: 10 }),
  X('curl', 'Barbell Curl', 'barbell', 'curl', { STR: 90, FREE: 10 }, { inc: 5 }),
  // Dumbbell & kettlebell
  X('dbbench', 'Dumbbell Bench Press', 'dumbbell', 'bench', { STR: 80, DEX: 10, FREE: 10 }, { inc: 5 }),
  X('dbrow', 'Dumbbell Row', 'dumbbell', 'row', { STR: 75, DEX: 15, FREE: 10 }, { inc: 5 }),
  X('dbpress', 'Dumbbell Shoulder Press', 'dumbbell', 'ohp', { STR: 70, DEX: 20, FREE: 10 }, { inc: 5 }),
  X('dbcurl', 'Dumbbell Curl', 'dumbbell', 'curl', { STR: 90, FREE: 10 }, { inc: 5 }),
  X('arnoldcurl', 'Schwarzenegger Curl', 'dumbbell', 'curl', { STR: 80, END: 10, FREE: 10 }, { inc: 5 }),
  X('goblet', 'Goblet Squat', 'dumbbell', 'squat', { STR: 60, DEX: 15, END: 15, FREE: 10 }, { inc: 5 }),
  X('lunge', 'Dumbbell Lunge', 'dumbbell', 'lunge', { STR: 45, DEX: 45, FREE: 10 }, { inc: 5 }),
  X('lateral', 'Lateral Raise', 'dumbbell', 'raise', { STR: 65, END: 15, DEX: 10, FREE: 10 }, { inc: 5 }),
  X('farmer', "Farmer's Carry", 'dumbbell', 'generic', { STR: 50, END: 40, FREE: 10 }, { inc: 5 }),   // for now, reps = lengths walked (~20 m)
  X('kbswing', 'Kettlebell Swing', 'kettlebell', 'swing', { SPD: 40, END: 30, STR: 15, DEX: 5, FREE: 10 }, { inc: 5 }),
  // Machine & cable
  X('pulldown', 'Lat Pulldown', 'machine', 'pulldown', { STR: 80, END: 10, FREE: 10 }, { inc: 5 }),
  X('legpress', 'Leg Press', 'machine', 'legpress', { STR: 80, END: 10, FREE: 10 }, { inc: 10 }),
  X('cablerow', 'Seated Cable Row', 'machine', 'row', { STR: 80, END: 10, FREE: 10 }, { inc: 5 }),
  X('pushdown', 'Triceps Pushdown', 'machine', 'pushdown', { STR: 80, END: 10, FREE: 10 }, { inc: 5 }),
  // Calisthenics
  X('pushups', 'Push-up', 'bodyweight', 'pushup', { STR: 45, END: 40, DEX: 5, FREE: 10 }, { bw: 0.65 }),
  X('pikepush', 'Pike Push-up', 'bodyweight', 'pushup', { STR: 55, DEX: 35, FREE: 10 }, { bw: 0.7 }),
  X('pullups', 'Pull-up', 'bodyweight', 'pullup', { STR: 65, DEX: 25, FREE: 10 }, { bw: 1 }),
  X('chinups', 'Chin-up', 'bodyweight', 'pullup', { STR: 70, DEX: 20, FREE: 10 }, { bw: 1 }),
  X('dips', 'Dip', 'bodyweight', 'dip', { STR: 65, END: 25, FREE: 10 }, { bw: 1 }),
  X('invrow', 'Inverted Row', 'bodyweight', 'invrow', { STR: 55, END: 20, DEX: 15, FREE: 10 }, { bw: 0.6 }),
  X('bwsquat', 'Bodyweight Squat', 'bodyweight', 'bwsquat', { END: 70, STR: 20, FREE: 10 }, { bw: 0.7 }),
  X('pistol', 'Pistol Squat', 'bodyweight', 'bwsquat', { DEX: 50, STR: 40, FREE: 10 }, { bw: 0.9 }),
  X('legraise', 'Hanging Leg Raise', 'bodyweight', 'legraise', { DEX: 50, STR: 30, END: 10, FREE: 10 }, { bw: 0.35 }),

// 8 weeks of Mon/Wed/Fri A/B sessions with realistic progress: steady gains, a bench stall and deload.
function loadSample() {

  const capacity = { squat: 170, bench: 125, row: 120, ohp: 85, deadlift: 205, pullup: 25 };   // where reps start to fail
  const growth = { squat: 1.3, bench: 0.3, row: 0.8, ohp: 0.35, deadlift: 2.2, pullup: 0.45 };  // per session
  const day = 86400000, today = new Date(new Date().toDateString()).getTime();
  let n = 0;
  for (let t = today - 56 * day; t < today; t += day) {
    const date = new Date(t);
    if (![1, 3, 5].includes(date.getDay())) continue;
    const tpl = S.templates[n % 2]; n++;
    const started = t + 18 * 3600000;
    const sess = { id: uid(), templateId: tpl.id, name: tpl.name, started, bodyweight: S.bodyweight, exercises: tpl.items.map(sessionExercise) };
    for (const ex of sess.exercises) {
      if (!ex.sets) continue;
      if (xs(ex.exId).fails >= SUGGEST_DELOAD_AFTER) deloadSessionExercise(ex);   // the lifter took the suggestion
      const cap = capacity[ex.exId] + growth[ex.exId] * n;

        `<td>${d.kind === 'cardio' ? '✓' : stepper(c.log[r][s], 'cReps', `data-r="${r}" data-s="${s}"`)}</td>`).join('')}</tr>`; }).join('')}
      </tbody></table></div>${grid}
      <button class="primary block" data-act="finish" style="margin-top:12px">Save workout</button>`;
  }
  const ph = now.ph, st = sess.stations[ph.s], d = exById(st.exId);
  const label = ph.type === 'ready' ? 'Get ready' : ph.type === 'work' ? `Round ${ph.r + 1} of ${c.rounds} · Station ${ph.s + 1} of ${n}` : 'Transition';
  const nextIdx = ph.type === 'work' ? (ph.s + 1 < n ? { r: ph.r, s: ph.s + 1 } : ph.r + 1 < c.rounds ? { r: ph.r + 1, s: 0 } : null) : null;
  const upNext = nextIdx ? sess.stations[nextIdx.s] : null;

        <div style="font-size:20px;font-weight:700">${esc(d.name)}</div>
        <div class="plan">${stationTarget(st, sess)}</div></div></div>
      ${ph.type === 'work' && d.kind !== 'cardio' ? `<div class="row" style="margin-top:12px"><div class="grow muted small">Reps this round (defaults to the target)</div>${stepper(c.log[ph.r][ph.s], 'cReps', `data-r="${ph.r}" data-s="${ph.s}"`)}</div>` : ''}
      ${upNext ? `<div class="muted small" style="margin-top:10px">Then: ${esc(exById(upNext.exId).name)} · ${stationTarget(upNext, sess)}</div>` : ''}
    </div>
    <div class="row" style="gap:8px">
      <button class="block" data-act="cPause">${c.pausedAt ? '▶ Resume' : '⏸ Pause'}</button>
      <button class="block" data-act="cSkip">Skip ⏭</button>
    </div>
    <div class="card" style="margin-top:10px">${grid}
      <label class="toggles" style="margin-top:8px"><span><input type="checkbox" data-act="voice" ${S.voice !== false ? 'checked' : ''}> Spoken cues</span></label></div>`;
}
function finishCircuit() {
  const sess = S.active, c = sess.c, now = circuitNow(sess);
  const reached = (r, s) => stationStarted(sess, r, s, now);
  sess.exercises = sess.stations.map((st, s) => {
    const d = exById(st.exId);
    if (d.kind === 'cardio') {
      const n = Array.from({ length: c.rounds }, (_, r) => reached(r, s)).filter(Boolean).length;
      return { exId: st.exId, cardio: { min: Math.round(n * c.workSec / 60 * 10) / 10, done: n > 0 } };
    }
    return { exId: st.exId, warmups: [], sets: Array.from({ length: c.rounds }, (_, r) =>
      ({ w: st.w, r: st.reps, done: reached(r, s), repsDone: reached(r, s) ? c.log[r][s] : null })) };
  });
  completeSession(sess, Date.now());
  S.active = null; lastCue = null; wakeLock(false);
  save(); view = { name: 'summary', id: sess.id }; render();
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const $ = s => document.querySelector(s);
// −/+ stepper. With typed: true the middle is a number field you can type into (weights).
const stepper = (value, act, data, suffix = '', { typed = false, prefix = '' } = {}) =>
  `<span class="stepper"><button data-act="${act}" data-d="-1" ${data}>−</button>` +
  (typed
    ? `<span>${prefix ? `<small>${prefix}</small>` : ''}<input type="number" inputmode="decimal" step="any" min="0" value="${value}" data-act="${act}" data-in ${data} aria-label="Weight">${suffix ? `<small>${suffix}</small>` : ''}</span>`
    : `<span>${value}${suffix ? `<small>${suffix}</small>` : ''}</span>`) +
  `<button data-act="${act}" data-d="1" ${data}>+</button></span>`;
// New value for a stepper action: typed absolute value, or old ± step.
function stepValue(el, old, step, min = 0) {
  if (el.dataset.in != null) { const v = parseFloat(el.value); return isNaN(v) ? old : Math.max(min, v); }
  return Math.max(min, old + (+el.dataset.d || 0) * step);
}
const summaryLine = t => t.circuit
  ? `⏱ Circuit · ${t.items.map(i => exById(i.exId).name.replace('Barbell ', '').replace(' Machine', '')).join(' → ')} · ${t.rounds} rounds · ~${circuitMinutes(t)} min`
  : t.items.map(i => {
  const d = exById(i.exId);
  return d.kind === 'cardio' ? `${d.name} ${i.minutes || 30}m` : `${d.name.replace('Barbell ', '')} ${i.sets}×${i.reps}`;
}).join(' · ');

const fmtClock = s => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
const fmtNum = v => (Math.round(v * 10) / 10).toLocaleString();
const shortDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const longDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

function render() {
  const app = $('#app');
  CHARTS = {};
  if (view.name === 'home') app.innerHTML = homeView();
  else if (view.name === 'edit') app.innerHTML = editView();

// ---------------------------------------------------------------------------
// Progress per exercise, built from the logged history
// ---------------------------------------------------------------------------
const epley = (w, r) => w * (1 + r / 30);   // estimated 1-rep max
function mainMetric(def) {
  if (def.kind === 'cardio') return { label: 'Minutes', unit: 'min' };
  if (def.kind === 'timed') return { label: 'Longest hold', unit: 'sec' };
  if (def.kind === 'bodyweight') return { label: 'Best set', unit: 'reps' };
  if (def.kind === 'weighted') return { label: 'Top set (added)', unit: 'lb' };
  return { label: 'Top set', unit: 'lb' };
}
function exerciseLog(exId) {
  const def = exById(exId), rows = [];
  let best = -Infinity;
  for (const h of [...S.history].reverse()) {
    const ex = h.exercises.find(e => e.exId === exId);
    if (!ex) continue;
    if (h.circuit && isLoaded(def.kind)) continue;   // circuit loads aren't strength sets; keep them out of strength charts
    let row;
    if (def.kind === 'cardio') {
      if (!ex.cardio || !ex.cardio.done) continue;
      row = { t: h.finished, workout: h.name, main: ex.cardio.min, sets: [`${ex.cardio.min} min`] };
    } else {
      const done = ex.sets.filter(s => s.done && s.repsDone > 0);
      if (!done.length) continue;
      row = {
        t: h.finished, workout: h.name, deloaded: !!ex.deloaded,
        main: Math.max(...done.map(s => prMetric(def, s))),
        e1rm: isLoaded(def.kind) && def.kind !== 'weighted' ? Math.round(Math.max(...done.map(s => epley(s.w, s.repsDone)))) : null,
        volume: Math.round(done.reduce((a, s) => a + (s.w + h.bodyweight * (def.bw || 0)) * s.repsDone, 0)),
        total: done.reduce((a, s) => a + s.repsDone, 0),
        sets: done.map(s => isLoaded(def.kind) ? `${fmtW(s.w, def)}×${s.repsDone}` : `${s.repsDone}${def.kind === 'timed' ? 's' : ''}`),
      };
    }
    row.pr = rows.length > 0 && row.main > best;
    best = Math.max(best, row.main);
    rows.push(row);
  }
  return rows;
}
function loggedExercises() {
  const ids = [];
  for (const h of S.history) for (const ex of h.exercises) if (!ids.includes(ex.exId)) ids.push(ex.exId);
  return ids.filter(id => exerciseLog(id).length);
}

// ---------------------------------------------------------------------------
// Charts (inline SVG). Colors: validated reference palette, dark steps
// (series 1 blue, series 2 orange). Text uses ink tokens, never series colors.
// ---------------------------------------------------------------------------
const CV = { s1: '#3987e5', s2: '#d95926', grid: '#2c2c2a', muted: '#898781', ring: '#1c1f23' };
const CW = 440, CH = 190, PL = 42, PR = 46, PT = 14, PB = 24;
let CHARTS = {}, chartSeq = 0;
function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  let v = Math.floor(lo / step) * step;
  const out = [+v.toFixed(4)];
  while (v < hi - 1e-9) { v += step; out.push(+v.toFixed(4)); }
  return out;
}
function xLabels(xs, rows) {
  const n = rows.length, idx = n <= 4 ? rows.map((_, i) => i) : [...new Set([0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1])];
  return idx.map(i => `<text x="${xs[i]}" y="${CH - 6}" text-anchor="middle" class="ax">${shortDate(rows[i].t)}</text>`).join('');
}
function gridY(ticks, y) {
  return ticks.map(v => `<line x1="${PL}" x2="${CW - PR}" y1="${y(v)}" y2="${y(v)}" stroke="${CV.grid}"/><text x="${PL - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${fmtNum(v)}</text>`).join('');
}
function chartShell(id, svg, legend, label) {
  return `${legend}<div class="chartwrap"><svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)}">${svg}</svg><div class="tip"></div></div>`;
}
function lineChart(rows, series, unit, label) {
  const id = 'c' + (++chartSeq);
  const vals = rows.flatMap(r => series.map(s => r[s.key]).filter(v => v != null));
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const t0 = rows[0].t, t1 = rows[rows.length - 1].t;
  const x = t => t1 === t0 ? (PL + CW - PR) / 2 : PL + (t - t0) / (t1 - t0) * (CW - PL - PR);
  const y = v => PT + (1 - (v - lo) / (hi - lo || 1)) * (CH - PT - PB);
  const xs = rows.map(r => x(r.t));
  let g = gridY(ticks, y) + xLabels(xs, rows);
  rows.forEach((r, i) => { if (r.deloaded) g += `<line x1="${xs[i]}" x2="${xs[i]}" y1="${PT}" y2="${CH - PB}" stroke="${CV.muted}"/><text x="${xs[i] + 3}" y="${PT - 3}" class="ax">Deload</text>`; });
  for (const s of series) {
    const pts = rows.map((r, i) => r[s.key] == null ? null : `${xs[i].toFixed(1)},${y(r[s.key]).toFixed(1)}`).filter(Boolean);
    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  rows.forEach((r, i) => { if (r.pr) g += `<circle cx="${xs[i]}" cy="${y(r[series[0].key])}" r="4" fill="${series[0].color}" stroke="${CV.ring}" stroke-width="2"/>`; });
  const last = rows[rows.length - 1];
  let firstLabelY = null;
  for (const s of series) {
    const v = last[s.key]; if (v == null) continue;
    const yy = y(v);
    g += `<circle cx="${xs[xs.length - 1]}" cy="${yy}" r="4" fill="${s.color}" stroke="${CV.ring}" stroke-width="2"/>`;
    if (firstLabelY == null || Math.abs(yy - firstLabelY) >= 14) g += `<text x="${xs[xs.length - 1] + 8}" y="${yy + 4}" class="lbl">${fmtNum(v)}</text>`;
    if (firstLabelY == null) firstLabelY = yy;
  }
  g += `<g class="hov" style="display:none"><line class="hx" y1="${PT}" y2="${CH - PB}" stroke="${CV.muted}"/>${series.map((s, k) => `<circle class="hd${k}" r="5" fill="${s.color}" stroke="${CV.ring}" stroke-width="2"/>`).join('')}</g>`;
  g += `<rect x="0" y="0" width="${CW}" height="${CH}" fill="transparent" data-chart="${id}"/>`;
  CHARTS[id] = { type: 'line', rows, series, unit, xs, y };
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>` : '';
  return chartShell(id, g, legend, label);
}
function barChart(rows, key, unit, label) {
  const id = 'c' + (++chartSeq);
  const ticks = niceTicks(0, Math.max(...rows.map(r => r[key])));
  const hi = ticks[ticks.length - 1], base = CH - PB;
  const y = v => PT + (1 - v / hi) * (CH - PT - PB);
  const band = (CW - PL - PR) / rows.length, bw = Math.max(2, Math.min(24, band - 2));
  const xs = rows.map((_, i) => PL + band * (i + 0.5));
  let g = gridY(ticks, y) + xLabels(xs, rows);
  rows.forEach((r, i) => {
    const top = y(r[key]), x0 = xs[i] - bw / 2, rr = Math.min(4, bw / 2, base - top);
    g += `<path class="barm" d="M${x0},${base} V${top + rr} Q${x0},${top} ${x0 + rr},${top} H${x0 + bw - rr} Q${x0 + bw},${top} ${x0 + bw},${top + rr} V${base} Z" fill="${CV.s1}"/>`;
  });
  g += `<rect x="0" y="0" width="${CW}" height="${CH}" fill="transparent" data-chart="${id}"/>`;
  CHARTS[id] = { type: 'bar', rows, series: [{ key, label, color: CV.s1 }], unit, xs };
  return chartShell(id, g, '', label);
}
function sparkline(vals) {
  if (vals.length < 2) return '';
  const w = 96, h = 32, p = 5, lo = Math.min(...vals), hi = Math.max(...vals);
  const pt = (v, i) => [p + i / (vals.length - 1) * (w - 2 * p), h - p - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - 2 * p)];
  const pts = vals.map(pt), [lx, ly] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.map(q => q.join(',')).join(' ')}" fill="none" stroke="${CV.muted}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="4" fill="${CV.s1}" stroke="${CV.ring}" stroke-width="2"/></svg>`;
}
// Hover / touch: crosshair + tooltip on lines, highlighted bar + tooltip on bars.
function chartPoint(e) {
  const rect = e.target.closest && e.target.closest('rect[data-chart]');
  const c = rect && CHARTS[rect.dataset.chart];
  if (!c) return;
  const svg = rect.ownerSVGElement, box = svg.getBoundingClientRect();
  const px = (e.clientX - box.left) / box.width * CW;
  let i = 0;
  c.xs.forEach((xx, k) => { if (Math.abs(xx - px) < Math.abs(c.xs[i] - px)) i = k; });
  const r = c.rows[i];
  if (c.type === 'line') {
    const hov = svg.querySelector('.hov');
    hov.style.display = '';
    hov.querySelector('.hx').setAttribute('x1', c.xs[i]); hov.querySelector('.hx').setAttribute('x2', c.xs[i]);
    c.series.forEach((s, k) => {
      const dot = hov.querySelector('.hd' + k);
      if (r[s.key] == null) { dot.style.display = 'none'; return; }
      dot.style.display = ''; dot.setAttribute('cx', c.xs[i]); dot.setAttribute('cy', c.y(r[s.key]));
    });
  } else {
    svg.querySelectorAll('.barm').forEach((b, k) => { b.style.opacity = k === i ? 1 : 0.4; });
  }
  const tip = svg.parentElement.querySelector('.tip');
  tip.innerHTML = `<div><b>${longDate(r.t)}</b> · ${esc(r.workout)}</div>` +
    c.series.map(s => r[s.key] == null ? '' : `<div><i style="background:${s.color}"></i>${s.label}: <b>${fmtNum(r[s.key])}</b> ${c.unit}</div>`).join('') +
    (r.sets ? `<div class="muted">${esc(r.sets.join(', '))}</div>` : '') + (r.pr ? '<div>🏆 PR</div>' : '') + (r.deloaded ? '<div class="muted">Deload session</div>' : '');
  tip.style.display = 'block';
  const left = c.xs[i] / CW * box.width, tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(box.width - tw, left - tw / 2)) + 'px';
}
function chartLeave(e) {
  const rect = e.target.closest && e.target.closest('rect[data-chart]');
  if (!rect) return;
  const svg = rect.ownerSVGElement;
  const hov = svg.querySelector('.hov'); if (hov) hov.style.display = 'none';
  svg.querySelectorAll('.barm').forEach(b => { b.style.opacity = 1; });
  svg.parentElement.querySelector('.tip').style.display = 'none';
}
document.addEventListener('pointermove', chartPoint);
document.addEventListener('pointerdown', chartPoint);
document.addEventListener('pointerout', chartLeave);

function sessionView() {
  const s = S.active;
  if (!s) { view = { name: 'home' }; return homeView(); }
  if (s.circuit) return circuitView() + `<button class="ghost danger" data-act="discard" style="margin-top:16px">Discard workout</button>`;
  const mins = Math.floor((Date.now() - s.started) / 60000);
  return `
    <div class="topbar"><button class="ghost" data-act="home">← Home</button><h1>${esc(s.name)}</h1><button class="primary" data-act="finish">Finish</button></div>
    <div class="muted small" style="margin-bottom:10px">Started ${mins} min ago · tap a circle when you finish a set (tap again to count down missed reps) · tap a set's number to remove it</div>
    ${s.exercises.map((ex, ei) => {
      const d = exById(ex.exId);
      if (d.kind === 'cardio') {
        return `<div class="card"><div class="row">${art(d.art)}<div class="grow"><b>${esc(d.name)}</b><div class="muted small">Cardio</div></div></div>
          <div class="set" style="grid-template-columns:1fr 50px"><span>${stepper(ex.cardio.min, 'cardioMin', `data-ex="${ei}"`, ' min')}</span>
          <button class="circle ${ex.cardio.done ? 'done' : ''}" data-act="cardioDone" data-ex="${ei}">${ex.cardio.done ? '✓' : ''}</button></div></div>`;
      }
      const top = ex.sets.length ? Math.max(...ex.sets.map(s => s.w)) : 0;
      // Warmup and work sets are the same kind of row: editable weight and reps, tap to log, tap the number to remove.
      const row = (s, si, kind) => {
        const data = `data-ex="${ei}" data-set="${si}" data-kind="${kind}"`;
        const cls = s.done ? (s.repsDone >= s.r ? 'done' : 'short') : '';
        const wcell = repsOnly(d.kind) ? '<span class="muted small">Bodyweight</span>'
          : stepper(s.w, 'setW', data, '', { typed: true, prefix: d.kind === 'weighted' ? 'BW+' : '' });
        return `<div class="set ${kind === 'warm' ? 'warm' : ''}"><button class="n" data-act="rmSet" ${data} title="Remove this set">${kind === 'warm' ? 'W' : si + 1}</button>
          <span>${wcell}</span><span>${stepper(s.r, 'setR', data, d.kind === 'timed' ? ' sec' : ' reps')}</span>
          <button class="circle ${cls}" data-act="setDone" ${data}>${s.done ? s.repsDone : `<span style="opacity:.35">${s.r}</span>`}</button></div>`;
      };
      const sug = ex.warmups.length ? [] : suggestWarmups(top, d);
      const warm = ex.warmups.map((s, si) => row(s, si, 'warm')).join('') + (sug.length && !ex.sets.some(s => s.done)
        ? `<button class="ghost sugwarm" data-act="sugWarm" data-ex="${ei}">+ Suggested warmups: ${sug.map(s => `${fmtW(s.w, d)}×${s.r}`).join(', ')}</button>` : '');
      const work = ex.sets.map((s, si) => row(s, si, 'work')).join('');
      const st = isLoaded(d.kind) ? xs(ex.exId) : null;
      const anyDone = ex.sets.some(s => s.done);
      const banner = !st ? '' : ex.deloaded
        ? `<div class="banner info"><span class="grow">Deloaded ${Math.round(DELOAD_PCT * 100)}% for this session. Your miss streak is reset.</span></div>`
        : st.fails >= SUGGEST_DELOAD_AFTER && !anyDone
          ? `<div class="banner"><span class="grow">You missed reps ${st.fails} sessions in a row. Consider a deload to <b>${fmtW(deloadWeight(top, d), d)} lb</b>.</span><button data-act="deload" data-ex="${ei}">Deload</button></div>`
          : '';
      return `<div class="card">
        <div class="row">${art(d.art)}<div class="grow"><b>${esc(d.name)}</b>
          <div class="plan">${ex.sets.length}×${ex.sets[0] ? ex.sets[0].r : 0}${d.kind === 'timed' ? ' sec' : ''}${repsOnly(d.kind) ? '' : ` @ ${fmtW(top, d)} lb`}</div>
          ${d.kind === 'barbell' ? `<div class="plates">${platesPerSide(top)}</div>` : ''}
          ${st ? `<div class="muted small">${st.autoInc ? `+${st.inc} lb next time if all reps hit` : 'Auto-increment off'}</div>` : ''}</div>
          <button class="ghost" data-act="progress" data-exid="${ex.exId}" title="Progress">📈</button>
          <button class="ghost" data-act="exDel" data-ex="${ei}" title="Remove exercise">✕</button></div>
        ${banner}
        ${warm}${work}
        <div class="actions">
          <button class="ghost" data-act="addSet" data-ex="${ei}">+ Set</button>
          <button class="ghost" data-act="addWarm" data-ex="${ei}">+ Warmup</button>
          ${ex.warmups.length && !ex.warmups.some(s => s.done) ? `<button class="ghost" data-act="clearWarm" data-ex="${ei}">Clear warmups</button>` : ''}
          <span class="grow"></span>
          ${st && !ex.deloaded ? `<button class="ghost" data-act="deload" data-ex="${ei}">Deload −${Math.round(DELOAD_PCT * 100)}%</button>` : ''}
          ${st ? `<button class="ghost" data-act="exSettings" data-exid="${ex.exId}">⚙</button>` : ''}
        </div>
      </div>`;
    }).join('')}
    <button class="block" data-act="openLib" data-target="session">+ Add exercise</button>
    <button class="ghost danger" data-act="discard" style="margin-top:16px">Discard workout</button>`;
}

// Rest timer: counts down from your default (2:00 unless changed). −15s/+15s also change the default.
function renderRest() {
  const el = $('#rest');
  if (!rest || view.name !== 'session') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const left = Math.ceil(rest.target - (Date.now() - rest.start) / 1000);
  $('#restTime').textContent = fmtClock(Math.max(0, left));
  $('#restTime').style.color = left <= 0 ? 'var(--good)' : '';
  $('#restLabel').textContent = left <= 0 ? 'Rest done: next set!' : `Resting · ${fmtClock(rest.target)} timer`;
  if (left <= 0 && !rest.buzzed) { rest.buzzed = true; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} }
}
function adjustRest(delta) {
  S.restSec = Math.min(600, Math.max(15, S.restSec + delta));
  if (rest) rest.target = Math.max(15, rest.target + delta);
  save(); renderRest();
  if (view.name === 'home') render();
}
setInterval(() => { if (rest) renderRest(); }, 250);
$('#restSkip').onclick = () => { rest = null; renderRest(); };
$('#restMinus').onclick = () => adjustRest(-15);
$('#restPlus').onclick = () => adjustRest(15);

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
const defaultReps = def => def.kind === 'timed' ? 30 : def.kind === 'bodyweight' ? 10 : def.kind === 'weighted' ? 8 : ['barbell'].includes(def.kind) ? 5 : 10;
function addToTemplate(t, def) {
  const base = { id: uid(), exId: def.id };
  if (t.circuit) t.items.push({ ...base, reps: def.kind === 'cardio' ? 0 : defaultReps(def) * 2, w: isLoaded(def.kind) ? xs(def.id).weight : 0 });
  else if (def.kind === 'cardio') t.items.push({ ...base, minutes: 30 });
  else t.items.push({ ...base, sets: 3, reps: defaultReps(def) });
}
function addToSession(def) {
  const item = def.kind === 'cardio' ? { exId: def.id, minutes: 30 } : { exId: def.id, sets: 3, reps: defaultReps(def) };
  S.active.exercises.push(sessionExercise(item));
}

function handle(act, el, ev) {
  const d = +el.dataset.d || 0;
  const t = view.name === 'edit' ? S.templates.find(t => t.id === view.id) : null;
  const item = t && el.dataset.item ? t.items.find(i => i.id === el.dataset.item) : null;
  const ex = S.active && el.dataset.ex != null ? S.active.exercises[+el.dataset.ex] : null;
  const def = ex ? exById(ex.exId) : item ? exById(item.exId) : null;
  switch (act) {
    case 'home': view = { name: 'home' }; break;
    case 'resume': view = { name: 'session' }; break;
    case 'start': startSession(S.templates.find(t => t.id === el.dataset.id)); return;
    case 'edit': view = { name: 'edit', id: el.dataset.id }; break;
    case 'newTemplate': { const nt = { id: uid(), name: `Workout ${String.fromCharCode(65 + S.templates.length)}`, items: [] }; S.templates.push(nt); view = { name: 'edit', id: nt.id }; break; }
    case 'delTemplate': if (confirm('Delete this workout?')) { S.templates = S.templates.filter(x => x !== t); view = { name: 'home' }; } break;
    case 'bw': S.bodyweight = stepValue(el, S.bodyweight, 1, 50); break;
    case 'sample': if (confirm('Replace your data with 8 weeks of sample workouts?')) loadSample(); return;
    case 'progress': view = { name: 'progress', exId: el.dataset.exid }; modal = null; break;
    case 'reset': if (confirm('Reset all demo data?')) { S = seed(); rest = null; view = { name: 'home' }; } break;
    // template editing
    case 'itemSets': item.sets = Math.max(1, item.sets + d); break;
    case 'itemReps': item.reps = Math.max(1, item.reps + d * (exById(item.exId).kind === 'timed' ? 5 : 1)); break;
    case 'restDef': adjustRest(d * 15); return;
    // circuits
    case 'cRounds': t.rounds = Math.min(20, Math.max(1, t.rounds + d)); break;
    case 'cWork': t.workSec = Math.min(900, Math.max(15, t.workSec + d * 15)); break;
    case 'cTrans': t.transSec = Math.min(300, Math.max(0, t.transSec + d * 5)); break;
    case 'itemCW': item.w = stepValue(el, item.w || 0, stepOf(def)); break;
    case 'cReps': { const c = S.active.c; c.log[+el.dataset.r][+el.dataset.s] = Math.max(0, c.log[+el.dataset.r][+el.dataset.s] + d); break; }
    case 'cPause': {
      const c = S.active.c; audio();
      if (c.pausedAt) { c.pausedTotal += Date.now() - c.pausedAt; c.pausedAt = null; } else c.pausedAt = Date.now();
      break;
    }
    case 'cSkip': { const now = circuitNow(S.active); if (!now.done) S.active.c.start -= now.left * 1000 + 50; audio(); save(); circuitTick(); return; }
    // per-exercise memory (from the editor, a session, or the settings sheet)
    case 'star': { const st = S.templates.find(x => x.id === el.dataset.id); st.favorite = !st.favorite; break; }
    case 'exW': { const e = exById(el.dataset.exid), st = xs(e.id); st.weight = stepValue(el, st.weight, stepOf(e)); break; }
    case 'exInc': { const st = xs(el.dataset.exid); st.inc = Math.max(0, st.inc + d * 2.5); break; }
    case 'exSettings': modal = { name: 'exSettings', exId: el.dataset.exid }; break;
    case 'deloadEx': {
      const e = exById(el.dataset.exid), st = xs(e.id);
      const live = S.active && S.active.exercises.find(x => x.exId === e.id && x.sets && !x.deloaded);
      if (live) deloadSessionExercise(live); else { st.weight = deloadWeight(st.weight, e); st.fails = 0; }
      modal = null; break;
    }
    case 'deload': deloadSessionExercise(ex); break;
    case 'itemMin': item.minutes = Math.max(5, (item.minutes || 30) + d * 5); break;
    case 'itemDel': t.items = t.items.filter(i => i !== item); break;
    case 'itemUp': { const k = t.items.indexOf(item); if (k > 0) [t.items[k - 1], t.items[k]] = [t.items[k], t.items[k - 1]]; break; }
    // session logging
    case 'setW': {
      const arr = el.dataset.kind === 'warm' ? ex.warmups : ex.sets, si = +el.dataset.set;
      const old = arr[si].w, nw = stepValue(el, old, stepOf(def));
      if (el.dataset.kind === 'warm') arr[si].w = nw;
      // Changing a work set also updates the later, not-yet-done work sets at the same weight.
      else arr.forEach((s, k) => { if (k === si || (k > si && !s.done && s.w === old)) s.w = nw; });
      break;
    }
    case 'setR': { const s = (el.dataset.kind === 'warm' ? ex.warmups : ex.sets)[+el.dataset.set]; s.r = Math.max(1, s.r + d * (def.kind === 'timed' ? 5 : 1)); break; }
    case 'setDone': {
      const s = (el.dataset.kind === 'warm' ? ex.warmups : ex.sets)[+el.dataset.set];
      if (!s.done) { s.done = true; s.repsDone = s.r; }
      else if (s.repsDone > 0) s.repsDone--;
      else { s.done = false; s.repsDone = null; }
      if (s.done && el.dataset.kind !== 'warm') rest = { start: Date.now(), target: S.restSec };
      break;
    }
    case 'rmSet': {
      const arr = el.dataset.kind === 'warm' ? ex.warmups : ex.sets;
      // Warmups are cheap to re-add, so they go without a confirm.
      if (el.dataset.kind === 'warm' || confirm(`Remove set ${+el.dataset.set + 1}?`)) arr.splice(+el.dataset.set, 1);
      break;
    }
    case 'clearWarm': ex.warmups = []; break;
    case 'addSet': { const lastSet = ex.sets[ex.sets.length - 1] || { w: isLoaded(def.kind) ? xs(ex.exId).weight : 0, r: defaultReps(def) }; ex.sets.push(newSet(lastSet.w, lastSet.r)); break; }
    case 'addWarm': {
      // Barbell: the next plate jump above the last warmup (capped at the work weight). Otherwise repeat the last one.
      const prev = ex.warmups[ex.warmups.length - 1];
      const top = Math.max(...ex.sets.map(s => s.w), 0);
      const w = def.kind !== 'barbell' ? (prev ? prev.w : 0)
        : !prev ? BAR : Math.min(PLATE_JUMPS.find(j => j > prev.w) ?? prev.w, Math.max(top, prev.w));
      ex.warmups.push(newSet(w, WARMUP_REPS)); break;
    }
    case 'sugWarm': { const top = Math.max(...ex.sets.map(s => s.w), 0); ex.warmups = suggestWarmups(top, def).map(s => newSet(s.w, s.r)); break; }
    case 'libCat': modal.cat = el.dataset.cat; break;
    case 'exDel': if (confirm(`Remove ${def.name} from this workout?`)) S.active.exercises.splice(+el.dataset.ex, 1); break;
    case 'cardioMin': ex.cardio.min = Math.max(5, ex.cardio.min + d * 5); break;
    case 'cardioDone': ex.cardio.done = !ex.cardio.done; break;
    case 'finish': finishSession(); return;
    case 'discard': if (confirm('Discard this workout? Nothing will be saved.')) { S.active = null; rest = null; lastCue = null; wakeLock(false); view = { name: 'home' }; } break;
    // library
    case 'openLib': modal = { name: 'lib', target: el.dataset.target }; break;
    case 'closeModal': if (ev.target === el) modal = null; else return; break;
    case 'pickEx': {
      const picked = exById(el.dataset.id);
      if (modal.target === 'template') addToTemplate(S.templates.find(t => t.id === view.id), picked); else addToSession(picked);
      modal = null; break;
    }
    case 'customForm': modal = { name: 'custom', target: modal.target, draft: { name: '', kind: 'barbell', stat: 'STR', art: 'generic' } }; break;
    case 'cArt': modal.draft.art = el.dataset.k; break;
    case 'cSave': {
      const c = modal.draft;
      const nd = { id: 'c_' + uid(), name: c.name.trim(), kind: c.kind, art: c.art, inc: c.kind === 'weighted' ? 2.5 : 5, met: 6, dist: { [c.stat]: 90, FREE: 10 }, isCustom: true };
      S.custom.push(nd);
      if (modal.target === 'template') addToTemplate(S.templates.find(t => t.id === view.id), nd); else addToSession(nd);
      modal = null; break;
    }
    default: return;
  }
  save(); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  if (el.closest('[data-stop]') && el.dataset.act === 'closeModal' && el.classList.contains('modal')) return;
  handle(el.dataset.act, el, e);
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  if (!act) return;
  if (el.dataset.in != null) { handle(act, el, e); return; }   // typed weight
  const t = view.name === 'edit' ? S.templates.find(t => t.id === view.id) : null;
  const item = t && el.dataset.item ? t.items.find(i => i.id === el.dataset.item) : null;
  if (act === 'circuitToggle') {
    t.circuit = el.checked;
    if (t.circuit) {
      t.rounds ??= 3; t.workSec ??= 120; t.transSec ??= 30;
      t.items.forEach(it => { const d = exById(it.exId); it.w ??= isLoaded(d.kind) ? xs(it.exId).weight : 0; it.reps ??= defaultReps(d); });
    }
  }
  else if (act === 'voice') S.voice = el.checked;
  else if (act === 'exAuto') xs(el.dataset.exid).autoInc = el.checked;
  else if (act === 'rename') t.name = el.value.trim() || t.name;
  else if (act === 'cKind') modal.draft.kind = el.value;
  else if (act === 'cStat') modal.draft.stat = el.value;
  else return;
  save(); render();
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'libQ' && modal) { modal.q = e.target.value; $('#libgrid').innerHTML = libGrid(); return; }
  if (e.target.dataset.act === 'cName' && modal) {
    modal.draft.name = e.target.value;
    const btn = document.querySelector('[data-act="cSave"]'); if (btn) btn.disabled = !e.target.value.trim();
  }
});

render();
</script>
</body>
</html>
